  ['localStorage', 'Espacio del navegador para guardar datos que no se borran al recargar.'],
  ['Media query', 'Regla de CSS que se aplica solo si la pantalla cumple una condición.'],
  ['Responsive', 'Diseño que se adapta a cualquier tamaño de pantalla.'],
  ['Selector', 'La parte de una regla CSS que elige qué elementos estilizar.'],
  ['Semántica', 'Usar etiquetas que dicen qué es el contenido (header, nav, main).'],
  ['Servidor', 'Computadora que guarda la página y la envía cuando se la piden.'],
  ['URL', 'La dirección de una página web.'],
  ['Variable', 'Espacio con nombre donde un programa guarda un valor.'],
  ['VS Code', 'Editor de código gratuito que se instala en la computadora.'],
  ['Wireframe', 'Boceto de una página hecho con cajas, sin colores.']
];

</script>
<script>
(function () {
  'use strict';
  var NIV = { b: 'Básico', i: 'Intermedio', v: 'Avanzado' };
  var NIV_LARGO = { b: 'Nivel básico', i: 'Nivel intermedio', v: 'Nivel avanzado' };
  var PREF = 'dw3:';
  var view = document.getElementById('view');
  var side = document.getElementById('side');

  /* ---------- almacenamiento seguro ---------- */
  function lsGet(k, def) { try { var v = localStorage.getItem(PREF + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(PREF + k, JSON.stringify(v)); } catch (e) {} }
  function est(id, l) { return lsGet('e:' + id + ':' + l, {}); }
  function setEst(id, l, o) { lsSet('e:' + id + ':' + l, o); }

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function inline(s) {
    return esc(s).replace(/~([^~]+)~/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  }
  function md(s) {
    var lines = String(s || '').split('\n'), out = '', list = null, para = [];
    function flushP() { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } }
    function flushL() { if (list) { out += '</' + list + '>'; list = null; } }
    lines.forEach(function (ln) {
      var m;
      if (/^\s*$/.test(ln)) { flushP(); flushL(); return; }
      if ((m = ln.match(/^- (.*)$/))) { flushP(); if (list !== 'ul') { flushL(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
      if ((m = ln.match(/^\d+\. (.*)$/))) { flushP(); if (list !== 'ol') { flushL(); out += '<ol>'; list = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
      flushL(); para.push(ln);
    });
    flushP(); flushL();
    return out;
  }
  function trimCode(s) { return String(s || '').replace(/^\n+/, '').replace(/\s+$/, ''); }
  function esCodigo(e) { return e.h !== undefined || e.s !== undefined || e.j !== undefined; }
  function temaPorId(id) { for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i].id === id) return i; return -1; }
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200); }
  var ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
    reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
    pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 2 8.5v7L12 22l10-6.5v-7z"/><path d="M12 22v-6.5M22 8.5l-10 7-10-7M2 15.5l10-7 10 7M12 2v6.5"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>'
  };

  /* ---------- nivel global y tema visual ---------- */
  var nivel = lsGet('nivel', 'b');
  function pintarSeg() { document.querySelectorAll('#seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.l === nivel ? 'true' : 'false'); }); }
  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    nivel = b.dataset.l; lsSet('nivel', nivel); pintarSeg();
    var m = location.hash.match(/^#t\/([\d.]+)\/[biv]$/);
    if (m) location.hash = '#t/' + m[1] + '/' + nivel; else render();
    toast('Tu nivel: ' + NIV[nivel]);
  });
  pintarSeg();
  var temaVis = lsGet('theme', null);
  if (temaVis) document.documentElement.dataset.theme = temaVis;
  document.getElementById('themeBtn').addEventListener('click', function () {
    var oscuroAhora = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    temaVis = oscuroAhora ? 'light' : 'dark';
    document.documentElement.dataset.theme = temaVis; lsSet('theme', temaVis);
  });
  var menuBtn = document.getElementById('menuBtn');
  menuBtn.addEventListener('click', function () {
    var abierto = side.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
  });
  function cerrarMenu() { side.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }

  /* ---------- índice lateral ---------- */
  function dotsHTML(id) {
    return '<span class="dots" aria-hidden="true">' + ['b', 'i', 'v'].map(function (l) { return '<i data-l="' + l + '" class="' + (est(id, l).done ? 'on' : '') + '"></i>'; }).join('') + '</span>';
  }
  function renderSide(actual) {
    var h = '';
    UNIDADES.forEach(function (u) {
      h += '<h2>Unidad ' + u.n + ' · ' + esc(u.t) + '</h2><ul>';
      TEMAS.filter(function (t) { return t.u === u.n; }).forEach(function (t) {
        var nd = ['b', 'i', 'v'].filter(function (l) { return est(t.id, l).done; }).map(function (l) { return NIV[l]; });
        h += '<li><a href="#t/' + t.id + '/' + nivel + '"' + (t.id === actual ? ' aria-current="true"' : '') + '><span class="num">' + t.id + '</span><span class="tt">' + esc(t.t) + (nd.length ? '<span class="sr"> (terminado: ' + nd.join(', ') + ')</span>' : '') + '</span>' + dotsHTML(t.id) + '</a></li>';
      });
      h += '</ul>';
    });
    side.innerHTML = h;
  }

  /* ---------- progreso ---------- */
  function progreso(filtro) {
    var r = { b: 0, i: 0, v: 0, total: 0 };
    TEMAS.forEach(function (t) { if (filtro && !filtro(t)) return; r.total++; ['b', 'i', 'v'].forEach(function (l) { if (est(t.id, l).done) r[l]++; }); });
    return r;
  }
  function barra(p) {
    var max = p.total * 3 || 1;
    return '<div class="bar" role="img" aria-label="Terminados: ' + p.b + ' básicos, ' + p.i + ' intermedios, ' + p.v + ' avanzados de ' + p.total + ' temas"><span class="sb" style="width:' + (p.b / max * 100) + '%"></span><span class="si" style="width:' + (p.i / max * 100) + '%"></span><span class="sv" style="width:' + (p.v / max * 100) + '%"></span></div>';
  }

  /* ---------- vistas ---------- */
  function vInicio() {
    var p = progreso();
    var h = '<section class="hero"><div class="kicker">1.er año · BTP Soporte Técnico Informático</div>' +
      '<h1>Taller de Diseño Web</h1>' +
      '<p>Los ' + TEMAS.length + ' contenidos del programa, y <b>cada uno en tres niveles</b>. Todo el grupo trabaja el mismo tema en la misma clase, pero cada uno en el escalón que le corresponde.</p>' +
      '<a class="btn primary" href="#t/' + TEMAS[0].id + '/' + nivel + '">Empezar por el tema ' + TEMAS[0].id + '</a>' +
      '<div class="stairs" aria-hidden="true"><div class="stair b"><b>Básico</b><span>La idea y el primer paso.</span></div><div class="stair i"><b>Intermedio</b><span>Más herramientas, más control.</span></div><div class="stair v"><b>Avanzado</b><span>Como lo hacen los profesionales.</span></div></div></section>';
    h += '<h2 class="section-title">Cómo se usa</h2><div class="grid2">' +
      '<div class="card"><h3>1. Elegí tu nivel</h3><p>Arriba a la derecha marcás <b>B</b>, <b>I</b> o <b>A</b>. Cada tema se abre en ese nivel, pero podés pasar a otro con las pestañas cuando quieras.</p></div>' +
      '<div class="card"><h3>2. Leé y practicá</h3><p>Cada nivel trae una explicación corta y un ejercicio. Escribís en la zona de práctica y ves el resultado al instante.</p></div>' +
      '<div class="card"><h3>3. CodePen o VS Code</h3><p><b>Abrir en CodePen</b> crea un Pen con tu código para guardarlo. <b>Descargar para VS Code</b> baja un index.html listo para Live Server.</p></div>' +
      '<div class="card"><h3>4. Entregá</h3><p>Pegá el link, marcá <b>Lo terminé</b> y en <a href="#entregas">Mis entregas</a> copiás el resumen para CREA.</p></div></div>';
    h += '<h2 class="section-title">Tu avance</h2><p class="muted">' + (p.b + p.i + p.v) + ' de ' + (p.total * 3) + ' ejercicios terminados. Verde: básico · azul: intermedio · rosa: avanzado.</p>' + barra(p);
    h += '<div class="grid2">';
    UNIDADES.forEach(function (u) {
      var pu = progreso(function (t) { return t.u === u.n; });
      var primero = TEMAS.filter(function (t) { return t.u === u.n; })[0];
      h += '<div class="card unit-card"><a href="#t/' + primero.id + '/' + nivel + '"><span class="muted">Unidad ' + u.n + ' · ' + pu.total + ' temas</span><h3>' + esc(u.t) + '</h3>' + barra(pu) + '</a></div>';
    });
    h += '</div>';
    return h;
  }

  function vPrograma() {
    var h = '<h1 class="tema-h1">Programa en tres niveles</h1><p class="muted">Cada contenido del programa oficial tiene su versión básica, intermedia y avanzada. Tocá un nivel para ir directo.</p>';
    h += '<div class="tabla-wrap"><table class="t"><thead><tr><th>N.º</th><th>Contenido</th><th>Niveles</th></tr></thead><tbody>';
    UNIDADES.forEach(function (u) {
      h += '<tr><td colspan="3" style="background:var(--surface-2)"><b>Unidad ' + u.n + ' · ' + esc(u.t) + '</b></td></tr>';
      TEMAS.filter(function (t) { return t.u === u.n; }).forEach(function (t) {
        h += '<tr><td><code>' + t.id + '</code></td><td>' + esc(t.t) + '</td><td style="white-space:nowrap">' + ['b', 'i', 'v'].map(function (l) {
          return '<a class="pill ' + l + (est(t.id, l).done ? ' on' : '') + '" href="#t/' + t.id + '/' + l + '" title="' + esc(t[l].e.t) + '">' + NIV[l] + '</a>';
        }).join('') + '</td></tr>';
      });
    });
    h += '</tbody></table></div>';
    h += '<h2 class="section-title" id="rubrica">Rúbrica del proyecto final</h2><p class="muted">Los mismos tres niveles sirven para evaluar el proyecto de la Unidad 5.</p>';
    h += '<div class="tabla-wrap"><table class="t"><thead><tr><th>Criterio</th><th class="th-b">Básico</th><th class="th-i">Intermedio</th><th class="th-v">Avanzado</th></tr></thead><tbody>';
    RUBRICA.forEach(function (r) { h += '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; });
    h += '</tbody></table></div>';
    h += '<p class="muted" style="margin-top:18px">Fuente: <a href="https://planeamientoeducativo.utu.edu.uy/sites/planeamientoeducativo.utu.edu.uy/files/2025-04/Dise%C3%B1o_Web_T7I_TP.pdf">Programa de Diseño Web, BTP Soporte Técnico Informático (DGETP-UTU)</a>.</p>';
    return h;
  }

  function vGlosario() {
    var h = '<h1 class="tema-h1">Glosario</h1><label class="sr" for="glq">Buscar en el glosario</label><input id="glq" class="field" type="search" placeholder="Buscar una palabra…" style="max-width:360px"><dl class="gl" id="gl">';
    GLOSARIO.forEach(function (g) { h += '<div data-q="' + esc((g[0] + ' ' + g[1]).toLowerCase()) + '"><dt>' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd></div>'; });
    return h + '</dl>';
  }

  function listaEntregas() {
    var items = [];
    TEMAS.forEach(function (t) { ['b', 'i', 'v'].forEach(function (l) { var s = est(t.id, l); if (s.done) items.push({ t: t, l: l, s: s }); }); });
    return items;
  }
  function vEntregas() {
    var items = listaEntregas();
    var datos = lsGet('alumno', { nombre: '', grupo: '' });
    var h = '<h1 class="tema-h1">Mis entregas</h1><p class="muted">Lo que marcaste como terminado. Completá tu nombre y grupo y copiá el resumen para pegarlo en CREA.</p>';
    h += '<div class="grid2" style="margin-bottom:16px"><div><label for="nom"><b>Nombre</b></label><input id="nom" class="field" value="' + esc(datos.nombre) + '" autocomplete="name"></div><div><label for="gru"><b>Grupo</b></label><input id="gru" class="field" value="' + esc(datos.grupo) + '"></div></div>';
    if (!items.length) return h + '<div class="card"><p>Todavía no marcaste ningún ejercicio como terminado. Cuando termines uno, tocá <b>Lo terminé</b> debajo del ejercicio.</p></div>';
    h += '<div class="tabla-wrap"><table class="t"><thead><tr><th>Tema</th><th>Nivel</th><th>Ejercicio</th><th>Link o respuesta</th></tr></thead><tbody>';
    items.forEach(function (it) {
      var link = it.s.link ? '<a href="' + esc(it.s.link) + '" target="_blank" rel="noopener">' + esc(it.s.link) + '</a>' : '';
      var resp = it.s.resp ? '<div class="muted">' + esc(it.s.resp.slice(0, 140)) + (it.s.resp.length > 140 ? '…' : '') + '</div>' : '';
      h += '<tr><td><code>' + it.t.id + '</code></td><td><a class="pill ' + it.l + ' on" href="#t/' + it.t.id + '/' + it.l + '">' + NIV[it.l] + '</a></td><td>' + esc(it.t[it.l].e.t) + '</td><td>' + (link || resp || '<span class="muted">Sin link</span>') + (link ? resp : '') + '</td></tr>';
    });
    h += '</tbody></table></div><div class="done-row" style="margin-top:14px"><button class="btn primary" id="copiar">Copiar resumen para entregar</button><button class="btn" id="bajarRes">Descargar resumen (.txt)</button></div>';
    return h;
  }
  function textoResumen() {
    var d = lsGet('alumno', { nombre: '', grupo: '' });
    var t = 'Diseño Web · Entregas\nNombre: ' + (d.nombre || '-') + '\nGrupo: ' + (d.grupo || '-') + '\nFecha: ' + new Date().toLocaleDateString('es-UY') + '\n\n';
    listaEntregas().forEach(function (it) {
      t += it.t.id + ' ' + it.t.t + ' · ' + NIV[it.l] + ' · ' + it.t[it.l].e.t + '\n';
      if (it.s.link) t += '  Link: ' + it.s.link + '\n';
      if (it.s.resp) t += '  Respuesta: ' + it.s.resp.replace(/\n/g, '\n  ') + '\n';
      t += '\n';
    });
    return t;
  }

  /* ---------- vista de tema ---------- */
  function vTema(idx, l) {
    var t = TEMAS[idx];
    var u = UNIDADES.filter(function (x) { return x.n === t.u; })[0];
    var h = '<div class="crumb">Unidad ' + u.n + ' · ' + esc(u.t) + '</div><h1 class="tema-h1">' + t.id + ' · ' + esc(t.t) + '</h1>';
    h += '<div class="analogia">' + md(t.a) + '</div>';
    h += '<div class="tabs" role="tablist" aria-label="Niveles del tema">';
    ['b', 'i', 'v'].forEach(function (x) {
      var sel = x === l;
      h += '<button role="tab" id="tab-' + x + '" data-l="' + x + '" aria-selected="' + sel + '" aria-controls="panel" tabindex="' + (sel ? 0 : -1) + '" class="' + (est(t.id, x).done ? 'done' : '') + '"><span class="ck" aria-hidden="true"></span>' + NIV[x] + (est(t.id, x).done ? '<span class="sr"> (terminado)</span>' : '') + '</button>';
    });
    h += '<button role="tab" id="tab-t" data-l="t" class="alltab" aria-selected="' + (l === 't') + '" aria-controls="panel" tabindex="' + (l === 't' ? 0 : -1) + '">Ver los tres juntos</button>';
    h += '</div><div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-' + l + '">';
    if (l === 't') {
      h += '<p class="muted">Vista para planificar o proyectar: los tres niveles del tema, uno debajo del otro.</p><div class="tres">';
      ['b', 'i', 'v'].forEach(function (x) {
        h += '<div class="col ' + x + '"><span class="lvl-badge ' + x + '">' + NIV[x] + '</span><div class="explica">' + md(t[x].x) + '</div><h3>Ejercicio: ' + esc(t[x].e.t) + '</h3><div class="explica">' + md(t[x].e.c) + '</div><a class="btn small" href="#t/' + t.id + '/' + x + '">Ir al ejercicio</a></div>';
      });
      h += '</div>';
    } else {
      h += nivelHTML(t, l);
    }
    h += '</div>';
    var prev = TEMAS[idx - 1], next = TEMAS[idx + 1];
    var ll = l === 't' ? nivel : l;
    h += '<nav class="pager" aria-label="Temas anterior y siguiente">' +
      (prev ? '<a href="#t/' + prev.id + '/' + ll + '"><small>← Anterior</small>' + prev.id + ' · ' + esc(prev.t) + '</a>' : '<span></span>') +
      (next ? '<a class="nx" href="#t/' + next.id + '/' + ll + '"><small>Siguiente →</small>' + next.id + ' · ' + esc(next.t) + '</a>' : '<span></span>') + '</nav>';
    return h;
  }

  function nivelHTML(t, l) {
    var L = t[l], e = L.e, s = est(t.id, l), code = esCodigo(e);
    var h = '<span class="lvl-badge ' + l + '">' + NIV_LARGO[l] + '</span><div class="explica">' + md(L.x) + '</div>';
    h += '<section class="ejercicio ' + l + '" aria-labelledby="ejt"><div class="ej-head"><span class="tag">Ejercicio · ' + NIV[l] + (code ? ' · con código' : ' · respuesta escrita') + '</span><h3 id="ejt">' + esc(e.t) + '</h3></div>';
    h += '<div class="ej-body">' + md(e.c);
    h += '<p><b>Revisá que:</b></p><ul class="criterios">';
    e.k.forEach(function (k, n) {
      var on = s.crit && s.crit[n];
      h += '<li><label><input type="checkbox" data-crit="' + n + '"' + (on ? ' checked' : '') + '><span>' + inline(k) + '</span></label></li>';
    });
    h += '</ul>';
    if (e.p) h += '<details class="pista"><summary>Ver una pista</summary><p>' + inline(e.p) + '</p></details>';
    h += '</div>';
    if (code) {
      h += '<div class="practica" aria-label="Zona de práctica"><div class="pr-bar"><div class="pr-tabs" role="tablist" aria-label="Archivo a editar">' +
        '<button role="tab" data-f="h" aria-selected="true">HTML</button><button role="tab" data-f="s" aria-selected="false">CSS</button><button role="tab" data-f="j" aria-selected="false">JS</button></div>' +
        '<span class="sp"></span>' +
        '<button class="pr-btn run" id="run" title="Ctrl + Enter">' + ICON.play + 'Ejecutar</button>' +
        '<button class="pr-btn" id="reset">' + ICON.reset + 'Restaurar</button>' +
        '<button class="pr-btn" id="pen">' + ICON.pen + 'Abrir en CodePen</button>' +
        '<button class="pr-btn" id="dl">' + ICON.dl + 'Descargar para VS Code</button></div>' +
        '<div class="pr-split"><div><label class="sr" for="ed">Código</label><textarea id="ed" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>' +
        '<div class="resultado"><iframe id="out" title="Resultado del código" sandbox="allow-scripts allow-modals allow-forms allow-same-origin allow-popups"></iframe>' +
        '<div class="consola" id="cons" aria-live="polite"><span class="t">Consola</span></div></div></div>' +
        '<div class="pr-note">Tu código se guarda solo en este navegador. Para entregarlo, abrilo en CodePen, guardalo con Save y pegá el link abajo.</div></div>';
    }
    h += '<div class="entrega">';
    if (code) h += '<div><label for="link">Link de tu trabajo (CodePen o GitHub)</label><input id="link" type="url" inputmode="url" placeholder="https://codepen.io/…" value="' + esc(s.link || '') + '"></div>';
    h += '<div><label for="resp">' + (code ? 'Comentarios (opcional)' : 'Tu respuesta') + '</label><textarea id="resp" placeholder="' + (code ? 'Algo que quieras contarle a tu profe…' : 'Escribí acá tu respuesta…') + '">' + esc(s.resp || '') + '</textarea></div>';
    h += '<div class="done-row"><button class="done-btn" id="done" aria-pressed="' + (s.done ? 'true' : 'false') + '">' + (s.done ? '✓ Terminado' : 'Lo terminé') + '</button><span class="save-note" id="saved">Se guarda solo.</span></div></div>';
    h += '</section>';
    return h;
  }

  /* ---------- zona de práctica ---------- */
  var CAPTURA = "<scr" + "ipt>(function(){function s(n,a){try{parent.postMessage({dwlog:1,n:n,t:Array.prototype.map.call(a,function(x){if(typeof x==='object'){try{return JSON.stringify(x)}catch(e){return String(x)}}return String(x)}).join(' ')},'*')}catch(e){}}" +
    "['log','info','warn','error'].forEach(function(n){var o=console[n];console[n]=function(){s(n,arguments);o&&o.apply(console,arguments)}});" +
    "window.addEventListener('error',function(e){s('error',[(e.message||'Error')+(e.lineno?' (línea '+e.lineno+')':'')])});" +
    "window.addEventListener('unhandledrejection',function(e){s('error',['Promesa rechazada: '+(e.reason&&e.reason.message||e.reason)])});" +
    "document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^=\"#\"]');if(a&&a.getAttribute('href').length>1){e.preventDefault();var el=document.querySelector(a.getAttribute('href'));if(el)el.scrollIntoView();}else if(a&&a.getAttribute('href')==='#'){e.preventDefault();}},true);" +
    "document.addEventListener('submit',function(e){if(!e.defaultPrevented){e.preventDefault();s('info',['(El formulario se envió. En la zona de práctica no se recarga la página.)'])}});})();</scr" + "ipt>";
  function docCompleto(c, titulo, conCaptura) {
    return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>' + esc(titulo) + '</title>\n' +
      (conCaptura ? CAPTURA + '\n' : '') +
      '<style>\n' + c.s + '\n</style>\n</head>\n<body>\n' + c.h + '\n<scr' + 'ipt>\n' + c.j + '\n</scr' + 'ipt>\n</body>\n</html>';
  }
  function iniciarPractica(t, l) {
    var e = t[l].e, s = est(t.id, l);
    var orig = { h: trimCode(e.h), s: trimCode(e.s), j: trimCode(e.j) };
    var c = s.code ? { h: s.code.h, s: s.code.s, j: s.code.j } : { h: orig.h, s: orig.s, j: orig.j };
    var f = 'h';
    var ed = document.getElementById('ed'), out = document.getElementById('out'), cons = document.getElementById('cons');
    var nombres = { h: 'HTML', s: 'CSS', j: 'JavaScript' };
    function cargar() { ed.value = c[f]; ed.setAttribute('aria-label', 'Código ' + nombres[f]); }
    function guardar() { var st = est(t.id, l); st.code = c; setEst(t.id, l, st); }
    function correr() {
      cons.innerHTML = '<span class="t">Consola</span>';
      var doc = docCompleto(c, t.t, true);
      window.__dwOff = doc.slice(0, doc.lastIndexOf('<scr' + 'ipt>\n')).split('\n').length;
      out.srcdoc = doc;
    }
    cargar(); correr();
    document.querySelectorAll('.pr-tabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        f = b.dataset.f; cargar();
        document.querySelectorAll('.pr-tabs button').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
        ed.focus();
      });
    });
    var tGuardar;
    ed.addEventListener('input', function () { c[f] = ed.value; clearTimeout(tGuardar); tGuardar = setTimeout(guardar, 400); });
    ed.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); correr(); return; }
      if (ev.key === 'Tab' && !ev.shiftKey && !ev.altKey) {
        ev.preventDefault();
        var a = ed.selectionStart, z = ed.selectionEnd;
        ed.setRangeText('  ', a, z, 'end');
        c[f] = ed.value; guardar();
      }
      if (ev.key === 'Escape') { ed.blur(); }
    });
    document.getElementById('run').addEventListener('click', correr);
    document.getElementById('reset').addEventListener('click', function () {
      if (!confirm('¿Volver al código original de este ejercicio? Se pierde lo que escribiste acá.')) return;
      c = { h: orig.h, s: orig.s, j: orig.j }; guardar(); cargar(); correr(); toast('Código restaurado');
    });
    document.getElementById('pen').addEventListener('click', function () {
      var form = document.createElement('form');
      form.method = 'POST'; form.action = 'https://codepen.io/pen/define'; form.target = '_blank';
      var inp = document.createElement('input'); inp.type = 'hidden'; inp.name = 'data';
      inp.value = JSON.stringify({ title: t.id + ' ' + t.t + ' · ' + NIV[l] + ' · ' + e.t, description: 'Taller de Diseño Web · ' + NIV_LARGO[l], html: c.h, css: c.s, js: c.j, editors: '111' });
      form.appendChild(inp); document.body.appendChild(form); form.submit(); form.remove();
    });
    document.getElementById('dl').addEventListener('click', function () {
      var html = docCompleto(c, t.id + ' ' + t.t + ' · ' + NIV[l], false);
      html = html.replace('<body>\n', '<body>\n<!-- Ejercicio ' + t.id + ' · ' + NIV[l] + ': ' + e.t + ' -->\n<!-- Abrilo en VS Code y usá clic derecho → "Open with Live Server" -->\n');
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast('Se descargó index.html');
    });
    window.__dwOut = out; window.__dwCons = cons;
  }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.dwlog || !window.__dwOut || ev.source !== window.__dwOut.contentWindow) return;
    var div = document.createElement('div');
    div.className = d.n === 'error' ? 'error' : d.n === 'warn' ? 'warn' : '';
    var txt = String(d.t).replace(/ \(línea (\d+)\)$/, function (m, n) {
      var ln = +n - (window.__dwOff || 0);
      return ln > 0 ? ' (línea ' + ln + ' del JS)' : '';
    });
    div.textContent = (d.n === 'error' ? '✖ ' : d.n === 'warn' ? '⚠ ' : '› ') + txt;
    window.__dwCons.appendChild(div);
    window.__dwCons.scrollTop = window.__dwCons.scrollHeight;
  });

  function iniciarEntrega(t, l) {
    var link = document.getElementById('link'), resp = document.getElementById('resp'), done = document.getElementById('done'), saved = document.getElementById('saved');
    function guardar(campo, valor) {
      var s = est(t.id, l); s[campo] = valor; setEst(t.id, l, s);
      saved.textContent = 'Guardado ✓'; clearTimeout(guardar._t); guardar._t = setTimeout(function () { saved.textContent = 'Se guarda solo.'; }, 1500);
    }
    if (link) link.addEventListener('input', function () { guardar('link', link.value.trim()); });
    resp.addEventListener('input', function () { guardar('resp', resp.value); });
    document.querySelectorAll('[data-crit]').forEach(function (cb) {
      cb.addEventListener('change', function () { var s = est(t.id, l); s.crit = s.crit || []; s.crit[+cb.dataset.crit] = cb.checked; setEst(t.id, l, s); });
    });
    done.addEventListener('click', function () {
      var s = est(t.id, l); s.done = !s.done; setEst(t.id, l, s);
      done.setAttribute('aria-pressed', s.done ? 'true' : 'false');
      done.textContent = s.done ? '✓ Terminado' : 'Lo terminé';
      var tab = document.getElementById('tab-' + l);
      tab.classList.toggle('done', s.done);
      renderSide(t.id);
      if (s.done) {
        var siguiente = l === 'b' ? 'i' : l === 'i' ? 'v' : null;
        toast(siguiente ? '¡Bien! ¿Te animás al nivel ' + NIV[siguiente].toLowerCase() + '?' : '¡Bien! Completaste el nivel avanzado');
      }
    });
  }

  function iniciarTabs(t) {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs [role="tab"]'));
    tabs.forEach(function (b, i) {
      b.addEventListener('click', function () { location.hash = '#t/' + t.id + '/' + b.dataset.l; });
      b.addEventListener('keydown', function (ev) {
        var n = null;
        if (ev.key === 'ArrowRight') n = (i + 1) % tabs.length;
        if (ev.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
        if (ev.key === 'Home') n = 0;
        if (ev.key === 'End') n = tabs.length - 1;
        if (n !== null) { ev.preventDefault(); tabs[n].focus(); tabs[n].click(); }
      });
    });
  }

  /* ---------- enrutador ---------- */
  var ultimoTema = null;
  function render() {
    window.__dwOut = null;
    var hash = location.hash || '#inicio';
    var m = hash.match(/^#t\/([\d.]+)(?:\/([bivt]))?$/);
    document.querySelectorAll('.top nav a').forEach(function (a) { a.removeAttribute('aria-current'); });
    if (m && temaPorId(m[1]) >= 0) {
      var idx = temaPorId(m[1]), l = m[2] || nivel, t = TEMAS[idx];
      view.innerHTML = vTema(idx, l);
      document.title = t.id + ' ' + t.t + ' · Diseño Web';
      renderSide(t.id);
      iniciarTabs(t);
      if (l !== 't') {
        if (esCodigo(t[l].e)) iniciarPractica(t, l);
        iniciarEntrega(t, l);
      }
      if (ultimoTema !== t.id) { window.scrollTo(0, 0); }
      else { var tb = document.getElementById('tab-' + l); if (tb) tb.focus({ preventScroll: true }); }
      ultimoTema = t.id;
    } else {
      ultimoTema = null;
      var v = hash.replace('#', '');
      if (v === 'rubrica') v = 'programa';
      if (!/^(inicio|programa|entregas|glosario)$/.test(v)) v = 'inicio';
      var a = document.querySelector('.top nav a[data-v="' + v + '"]'); if (a) a.setAttribute('aria-current', 'page');
      view.innerHTML = v === 'programa' ? vPrograma() : v === 'entregas' ? vEntregas() : v === 'glosario' ? vGlosario() : vInicio();
      document.title = { inicio: 'Taller de Diseño Web', programa: 'Programa · Diseño Web', entregas: 'Mis entregas · Diseño Web', glosario: 'Glosario · Diseño Web' }[v];
      renderSide(null);
      if (hash === '#rubrica') { var r = document.getElementById('rubrica'); if (r) r.scrollIntoView(); } else window.scrollTo(0, 0);
      if (v === 'glosario') {
        document.getElementById('glq').addEventListener('input', function () {
          var q = this.value.trim().toLowerCase();
          document.querySelectorAll('#gl > div').forEach(function (d) { d.hidden = q && d.dataset.q.indexOf(q) < 0; });
        });
      }
      if (v === 'entregas') {
        ['nom', 'gru'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', function () {
            lsSet('alumno', { nombre: document.getElementById('nom').value, grupo: document.getElementById('gru').value });
          });
        });
        var cp = document.getElementById('copiar');
        if (cp) cp.addEventListener('click', function () {
          var txt = textoResumen();
          if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('Resumen copiado'); }, function () { prompt('Copiá este texto:', txt); });
          else prompt('Copiá este texto:', txt);
        });
        var br = document.getElementById('bajarRes');
        if (br) br.addEventListener('click', function () {
          var a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([textoResumen()], { type: 'text/plain;charset=utf-8' })); a2.download = 'entregas-diseno-web.txt'; document.body.appendChild(a2); a2.click(); a2.remove();
        });
      }
    }
    cerrarMenu();
  }
  window.addEventListener('hashchange', render);
  side.addEventListener('click', function (e) { if (e.target.closest('a')) cerrarMenu(); });
  render();
})();
</script>
