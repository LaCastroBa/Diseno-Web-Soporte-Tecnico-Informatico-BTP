<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Diseño Web</title>
<meta name="description" content="Diseño Web, 1.er año BTP Soporte Técnico Informático. Cada tema del programa en tres niveles: básico, intermedio y avanzado, con ejercicios para CodePen y Visual Studio Code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A1C2E'/%3E%3Crect x='12' y='38' width='10' height='14' rx='2' fill='%233FCB97'/%3E%3Crect x='27' y='26' width='10' height='26' rx='2' fill='%237C9DF5'/%3E%3Crect x='42' y='12' width='10' height='40' rx='2' fill='%23EC6DBE'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior (nivel + tema) · índice lateral por unidad · vista central (inicio, tema con pestañas de nivel, programa, entregas, glosario) */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F6F7FB;
  --ink: #1A1C2E;
  --ink-2: #545872;
  --line: #D6DBE6;
  --b: #0B7D59;   --b-t: #DCF2E9;
  --i: #2D58CF;   --i-t: #E2EAFC;
  --v: #A12C7B;   --v-t: #F6E2EF;
  --accent: #B35F00; --accent-t: #FBEBD6;
  --alert: #C9302A;
  --code-bg: #1B1D33;
  --code-ink: #E9EAF5;
  --code-dim: #9A9CC0;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-text: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  --radius: 14px;
  --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14152A; --surface: #1F2140; --surface-2: #191A35; --ink: #ECECF7; --ink-2: #A8AAC6; --line: #34375E;
    --b: #3FCB97; --b-t: #133A2D; --i: #7C9DF5; --i-t: #1D2A55; --v: #EC6DBE; --v-t: #3D1A33; --accent: #F0A54A; --accent-t: #3B2A12;
    --alert: #FF6B61; --code-bg: #0E0F22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14152A; --surface: #1F2140; --surface-2: #191A35; --ink: #ECECF7; --ink-2: #A8AAC6; --line: #34375E;
  --b: #3FCB97; --b-t: #133A2D; --i: #7C9DF5; --i-t: #1D2A55; --v: #EC6DBE; --v-t: #3D1A33; --accent: #F0A54A; --accent-t: #3B2A12;
  --alert: #FF6B61; --code-bg: #0E0F22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top) + 12px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 1.0625rem; line-height: 1.6; }
a { color: var(--i); }
code { font-family: var(--f-mono); font-size: 0.88em; background: var(--surface-2); border: 1px solid var(--line); padding: 0.05em 0.35em; border-radius: 5px; word-break: break-word; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0 0 0.5em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 10px; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; white-space: nowrap; }
.brand svg { flex: none; }
.top nav { display: flex; gap: 4px; margin-left: 8px; }
.top nav a { text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; font-size: 0.95rem; }
.top nav a:hover, .top nav a[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.top .sp { flex: 1; }
.lvl-pick { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--ink-2); }
.seg button[aria-pressed="true"][data-l="b"] { background: var(--b); color: #fff; }
.seg button[aria-pressed="true"][data-l="i"] { background: var(--i); color: #fff; }
.seg button[aria-pressed="true"][data-l="v"] { background: var(--v); color: #fff; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
#menuBtn { display: none; }

/* ---------- estructura ---------- */
.shell { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - var(--top)); }
.side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px 40px; }
.side h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-family: var(--f-text); margin: 18px 10px 6px; }
.side h2:first-child { margin-top: 4px; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side a { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: 9px; text-decoration: none; color: var(--ink); font-size: 0.92rem; line-height: 1.3; }
.side a:hover { background: var(--surface-2); }
.side a[aria-current="true"] { background: var(--i-t); }
.side .num { font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-2); min-width: 2.2em; padding-top: 2px; }
.side .tt { flex: 1; }
.dots { display: inline-flex; gap: 3px; padding-top: 5px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); }
.dots i.on[data-l="b"] { background: var(--b); border-color: var(--b); }
.dots i.on[data-l="i"] { background: var(--i); border-color: var(--i); }
.dots i.on[data-l="v"] { background: var(--v); border-color: var(--v); }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 80px; }
.wrap { max-width: 980px; margin: 0 auto; }

/* ---------- inicio ---------- */
.hero { background: var(--code-bg); color: #ECECF7; border-radius: 22px; padding: clamp(24px, 5vw, 48px); position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2rem, 5.5vw, 3.4rem); margin-bottom: 0.3em; }
.hero p { color: #C5C7E0; max-width: 60ch; margin: 0 0 1em; }
.hero .kicker { font-family: var(--f-mono); font-size: 0.8rem; letter-spacing: 0.06em; color: #9FD3FF; text-transform: uppercase; }
.stairs { display: flex; gap: 10px; align-items: flex-end; margin-top: 22px; flex-wrap: wrap; }
.stair { border-radius: 12px; padding: 12px 14px; color: #fff; min-width: 150px; flex: 1; max-width: 230px; }
.stair b { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.stair span { font-size: 0.88rem; opacity: 0.92; }
.stair.b { background: #0B7D59; } .stair.i { background: #2D58CF; padding-top: 30px; } .stair.v { background: #A12C7B; padding-top: 48px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 10px; cursor: pointer; text-decoration: none; font-weight: 700; font-size: 0.95rem; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: 0.9; }
.btn.small { padding: 6px 12px; font-size: 0.88rem; }
.btn svg { width: 18px; height: 18px; }
.hero .btn.primary { background: #fff; color: #1A1C2E; border-color: #fff; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.card h3 { font-size: 1.15rem; }
.card p { margin: 0 0 0.6em; color: var(--ink-2); }
.section-title { margin-top: 38px; font-size: 1.6rem; }
.unit-card a { text-decoration: none; color: inherit; display: block; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin-top: 10px; display: flex; }
.bar span { height: 100%; }
.bar .sb { background: var(--b); } .bar .si { background: var(--i); } .bar .sv { background: var(--v); }
.muted { color: var(--ink-2); font-size: 0.92rem; }

/* ---------- tema ---------- */
.crumb { font-family: var(--f-mono); font-size: 0.82rem; color: var(--ink-2); margin-bottom: 6px; }
.tema-h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
.analogia { background: var(--accent-t); border-left: 5px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; margin: 14px 0 22px; }
.analogia::before { content: "Para entenderlo"; display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tabs [role="tab"] { border: 1px solid var(--line); border-bottom: 0; background: var(--surface-2); border-radius: 12px 12px 0 0; padding: 10px 16px; cursor: pointer; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; margin-bottom: -2px; }
.tabs [role="tab"] .ck { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; display: inline-grid; place-items: center; font-size: 11px; line-height: 1; }
.tabs [role="tab"][data-l="b"] { color: var(--b); }
.tabs [role="tab"][data-l="i"] { color: var(--i); }
.tabs [role="tab"][data-l="v"] { color: var(--v); }
.tabs [role="tab"][aria-selected="true"] { background: var(--surface); border-bottom: 2px solid var(--surface); }
.tabs [role="tab"][aria-selected="true"][data-l="b"] { box-shadow: inset 0 4px 0 var(--b); }
.tabs [role="tab"][aria-selected="true"][data-l="i"] { box-shadow: inset 0 4px 0 var(--i); }
.tabs [role="tab"][aria-selected="true"][data-l="v"] { box-shadow: inset 0 4px 0 var(--v); }
.tabs [role="tab"][aria-selected="true"][data-l="t"] { box-shadow: inset 0 4px 0 var(--ink-2); color: var(--ink); }
.tabs [role="tab"].done .ck { background: currentColor; }
.tabs [role="tab"].done .ck::after { content: "✓"; color: var(--surface); font-weight: 700; }
.tabs .alltab { margin-left: auto; font-weight: 400; font-size: 0.9rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); padding: clamp(16px, 3vw, 28px); }
.lvl-badge { display: inline-block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
.lvl-badge.b { background: var(--b-t); color: var(--b); } .lvl-badge.i { background: var(--i-t); color: var(--i); } .lvl-badge.v { background: var(--v-t); color: var(--v); }
.explica p { margin: 0 0 0.8em; }
.explica ul, .explica ol { margin: 0 0 0.9em; padding-left: 1.3em; }
.explica li { margin-bottom: 0.3em; }
.ejercicio { margin-top: 22px; border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ejercicio.b { border-color: var(--b); } .ejercicio.i { border-color: var(--i); } .ejercicio.v { border-color: var(--v); }
.ej-head { padding: 14px 18px 4px; }
.ej-head .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.ejercicio.b .tag { color: var(--b); } .ejercicio.i .tag { color: var(--i); } .ejercicio.v .tag { color: var(--v); }
.ej-head h3 { font-size: 1.3rem; margin: 2px 0 8px; }
.ej-body { padding: 0 18px 16px; }
.ej-body p { margin: 0 0 0.7em; }
.ej-body ul { margin: 0 0 0.8em; padding-left: 1.3em; }
.criterios { list-style: none; padding: 0 !important; margin: 10px 0 12px !important; }
.criterios li { margin-bottom: 4px; }
.criterios label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.criterios input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--b); flex: none; }
.pista { background: var(--surface-2); border-radius: 10px; padding: 8px 14px; margin-bottom: 12px; }
.pista summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.pista p { margin: 8px 0 4px; white-space: pre-line; }

/* zona de práctica */
.practica { background: var(--code-bg); color: var(--code-ink); padding: 12px; }
.pr-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.pr-tabs { display: inline-flex; gap: 2px; background: rgba(255,255,255,0.06); padding: 3px; border-radius: 10px; }
.pr-tabs button { border: 0; background: transparent; color: var(--code-dim); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-family: var(--f-mono); font-size: 0.82rem; font-weight: 600; }
.pr-tabs button[aria-selected="true"] { background: rgba(255,255,255,0.14); color: #fff; }
.pr-bar .sp { flex: 1; }
.pr-btn { border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.pr-btn:hover { background: rgba(255,255,255,0.14); }
.pr-btn.run { background: #3FCB97; border-color: #3FCB97; color: #0E0F22; }
.pr-btn svg { width: 15px; height: 15px; }
.pr-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.editor { width: 100%; min-height: 300px; height: 100%; resize: vertical; background: #12132A; color: var(--code-ink); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px; font-family: var(--f-mono); font-size: 0.86rem; line-height: 1.55; tab-size: 2; white-space: pre; overflow: auto; }
.resultado { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.resultado iframe { width: 100%; height: 300px; border: 0; border-radius: 10px; background: #fff; }
.consola { background: #0A0B1A; border-radius: 10px; font-family: var(--f-mono); font-size: 0.78rem; max-height: 130px; min-height: 44px; overflow: auto; padding: 6px 10px; }
.consola .t { color: var(--code-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; }
.consola div { white-space: pre-wrap; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 2px 0; }
.consola .error { color: #FF8A80; } .consola .warn { color: #FFD180; }
.pr-note { font-size: 0.78rem; color: var(--code-dim); margin-top: 6px; }

/* entrega */
.entrega { padding: 14px 18px 18px; background: var(--surface-2); border-top: 1px solid var(--line); display: grid; gap: 10px; }
.entrega label { font-weight: 700; font-size: 0.92rem; display: block; margin-bottom: 4px; }
.entrega input[type="url"], .entrega textarea, .field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; }
.entrega textarea { min-height: 90px; resize: vertical; }
.done-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.done-btn { border: 2px solid var(--b); color: var(--b); background: var(--surface); font-weight: 700; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
.done-btn[aria-pressed="true"] { background: var(--b); color: #fff; }
.save-note { font-size: 0.82rem; color: var(--ink-2); }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.pager a { flex: 1; min-width: 200px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.pager a:hover { border-color: var(--ink-2); }
.pager small { display: block; color: var(--ink-2); font-size: 0.8rem; }
.pager .nx { text-align: right; }

/* vista de los tres niveles */
.tres { display: grid; gap: 14px; }
.tres .col { border-left: 5px solid var(--line); padding: 4px 0 4px 16px; }
.tres .col.b { border-color: var(--b); } .tres .col.i { border-color: var(--i); } .tres .col.v { border-color: var(--v); }
.tres h3 { font-size: 1.1rem; margin-bottom: 6px; }

/* tablas */
.tabla-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table.t { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
table.t th, table.t td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { background: var(--surface-2); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); }
table.t tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; text-decoration: none; font-size: 0.78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin: 1px 2px 1px 0; }
.pill.b { background: var(--b-t); color: var(--b); } .pill.i { background: var(--i-t); color: var(--i); } .pill.v { background: var(--v-t); color: var(--v); }
.pill.on.b { background: var(--b); color: #fff; } .pill.on.i { background: var(--i); color: #fff; } .pill.on.v { background: var(--v); color: #fff; }
.th-b { color: var(--b) !important; } .th-i { color: var(--i) !important; } .th-v { color: var(--v) !important; }
.gl dt { font-weight: 700; font-family: var(--f-display); font-size: 1.05rem; margin-top: 12px; }
.gl dd { margin: 2px 0 0; color: var(--ink-2); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: 0.25s; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .pr-split { grid-template-columns: 1fr; }
  .editor { min-height: 220px; }
}
@media (max-width: 900px) {
  #menuBtn { display: grid; }
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: var(--top); width: min(320px, 88vw); z-index: 25; transform: translateX(-102%); transition: transform 0.25s; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .side.open { transform: none; }
  .top nav { display: none; }
  .lvl-pick .lbl { display: none; }
  .brand .long { display: none; }
}
@media (max-width: 520px) {
  .seg button { padding: 4px 9px; }
  .tabs [role="tab"] { padding: 8px 10px; font-size: 0.9rem; }
  .tabs .alltab { margin-left: 0; }
  main { padding-top: 18px; }
}
@media print {
  .top, .side, .practica, .entrega, .pager, .tabs { display: none !important; }
  .shell { display: block; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="top">
  <button class="icon-btn" id="menuBtn" aria-label="Abrir índice de temas" aria-expanded="false" aria-controls="side">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#inicio">
    <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1A1C2E"/><rect x="12" y="38" width="10" height="14" rx="2" fill="#3FCB97"/><rect x="27" y="26" width="10" height="26" rx="2" fill="#7C9DF5"/><rect x="42" y="12" width="10" height="40" rx="2" fill="#EC6DBE"/></svg>
    <span>Diseño Web <span class="long">· Taller</span></span>
  </a>
  <nav aria-label="Secciones">
    <a href="#inicio" data-v="inicio">Inicio</a>
