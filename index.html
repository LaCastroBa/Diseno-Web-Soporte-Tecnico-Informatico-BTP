    j: `let fotos = [
  { src: 'https://picsum.photos/id/1015/500/280', alt: 'Río entre montañas' },
  { src: 'https://picsum.photos/id/1016/500/280', alt: 'Cañón rocoso' },
  { src: 'https://picsum.photos/id/1018/500/280', alt: 'Montañas con nieve' },
  { src: 'https://picsum.photos/id/1019/500/280', alt: 'Costa con niebla' }
];
let actual = 0;

function mostrar() {
  // completá
}` } }
});

tema({ id: '3.6', u: '3', t: 'Librerías y frameworks de JavaScript',
a: `**Una librería es una caja de herramientas prestada:** no fabricás el martillo, lo usás. **Un framework es un kit de muebles para armar:** te da la estructura y vos seguís sus reglas.`,
b: { x: `Una **librería** es código que escribió otra persona y que podés usar en tu página. Se agrega con un ~<script src="...">~ que la trae de un **CDN** (un servidor que la comparte gratis).

Ejemplo: **canvas-confetti** tira papelitos de colores con una sola línea: ~confetti();~`,
  e: { t: 'Fiesta de confeti', c: `La librería ya está agregada en el HTML. Hacé que al tocar el botón se tire confeti. Después buscá en su página (github.com/catdad/canvas-confetti) una opción para cambiar los colores o la cantidad, y usala.`,
    k: ['El botón tira confeti', 'Usaste al menos una opción de la librería', 'Explicás en un comentario qué es un CDN'],
    p: `~confetti({ particleCount: 200, spread: 90 });~`,
    h: `<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"><\/script>
<h1>¡Terminé el curso!</h1>
<button id="fiesta">Festejar 🎉</button>`,
    s: `body { font-family: sans-serif; text-align: center; padding-top: 60px; }
button { font-size: 1.4rem; padding: 12px 24px; }`,
    j: `document.getElementById('fiesta').addEventListener('click', function () {
  // llamá a confetti acá
});` } },
i: { x: `**jQuery** fue la librería más usada durante años y todavía está en muchísimos sitios. Hace más corto el código del DOM:
- ~$('#boton')~ selecciona (como querySelector).
- ~.on('click', function () { ... })~ escucha eventos.
- ~.fadeToggle()~, ~.slideToggle()~ animan.
- ~.text('Hola')~ cambia el texto.

Hoy JavaScript "puro" hace casi todo esto, pero vas a encontrar jQuery en sitios existentes.`,
  e: { t: 'Lo mismo, dos veces', c: `Con jQuery hacé que: el botón muestre y oculte la caja con ~slideToggle~ y que al pasar el mouse por cada ítem de la lista se resalte. Después escribí en un comentario cómo se haría lo primero en JavaScript puro.`,
    k: ['slideToggle funciona', 'Los ítems se resaltan con jQuery', 'El comentario muestra la versión en JS puro'],
    p: `~$('li').on('mouseenter', function () { $(this).addClass('luz'); });~`,
    h: `<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>
<button id="btn">Mostrar u ocultar</button>
<div id="caja">Soy una caja con información.</div>
<ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>`,
    s: `body { font-family: sans-serif; padding: 20px; }
#caja { background: #e2eafc; padding: 20px; margin: 10px 0; }
.luz { background: gold; }`,
    j: `$(function () {
  // tu código jQuery acá
});` } },
v: { x: `Un **framework** como **React**, **Vue** o **Angular** organiza la página en **componentes**: piezas reutilizables con su propio estado. Cuando el estado cambia, el framework actualiza la pantalla solo.

React normalmente usa JSX y herramientas de compilación. Para probar sin instalar nada podés usar ~React.createElement~ y cargar React desde un CDN.

¿Cuándo usar un framework? En aplicaciones grandes con muchos datos que cambian. Para un sitio simple, HTML + CSS + JS alcanza.`,
  e: { t: 'Componente contador', c: `Ejecutá el componente de React. Modificalo para que tenga un botón "−" además del "+", que no baje de 0, y usalo tres veces en la página (tres contadores independientes). Respondé en un comentario: ¿qué ventaja tiene un componente frente a copiar el HTML tres veces?`,
    k: ['Hay botones + y −', 'No baja de 0', 'Hay tres contadores independientes', 'El comentario explica la ventaja'],
    p: `Cada ~React.createElement(Contador, { nombre: 'Manzanas' })~ crea un contador nuevo con su propio estado.`,
    h: `<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>
<div id="app"></div>`,
    s: `body { font-family: sans-serif; padding: 20px; }
.contador { border: 1px solid #ccc; padding: 12px; margin: 8px 0; border-radius: 8px; }`,
    j: `var h = React.createElement;

function Contador(props) {
  var estado = React.useState(0);
  var n = estado[0], setN = estado[1];
  return h('div', { className: 'contador' },
    h('strong', null, props.nombre + ': ' + n + ' '),
    h('button', { onClick: function () { setN(n + 1); } }, '+')
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(
  h(Contador, { nombre: 'Manzanas' })
);` } }
});

tema({ id: '3.7', u: '3', t: 'Integración de componentes interactivos',
a: `**Como las piezas de un auto** (puertas, ventanillas, radio). Cada componente hace una sola cosa bien y se pueden combinar en cualquier página.`,
b: { x: `Algunos componentes interactivos vienen **en HTML, sin programar**:
- ~<details>~ y ~<summary>~ hacen un **acordeón**: el summary es el título que se toca y lo demás se abre y se cierra.
- ~<input type="range">~, ~type="color"~, ~type="date"~ dan controles listos.

Siempre que HTML ya lo resuelve, usalo: es accesible y no se rompe.`,
  e: { t: 'Preguntas frecuentes', c: `Armá una sección de preguntas frecuentes del liceo con al menos cuatro preguntas usando ~details~ y ~summary~. Dale estilo: borde, espacio y un cambio de color cuando está abierta (~details[open]~).`,
    k: ['Hay cuatro preguntas que se abren y se cierran', 'Tienen estilo', 'La abierta se ve distinta'],
    p: `~details[open] summary { color: #2D58CF; }~`,
    h: `<h2>Preguntas frecuentes</h2>
<details>
  <summary>¿A qué hora entramos?</summary>
  <p>El turno matutino entra a las 7:30.</p>
</details>`,
    s: `body { font-family: sans-serif; padding: 20px; max-width: 600px; }
summary { cursor: pointer; font-weight: bold; }` } },
i: { x: `**Pestañas (tabs):** varios paneles en el mismo lugar; se ve uno por vez según la pestaña elegida.

La lógica con JS:
1. Al tocar una pestaña, sacás la clase ~activa~ a todas.
2. Se la ponés a la tocada.
3. Ocultás todos los paneles y mostrás el que corresponde.

Un truco: guardá en cada pestaña a qué panel corresponde con ~data-panel="fotos"~ y leelo con ~boton.dataset.panel~.`,
  e: { t: 'Pestañas', c: `Programá las pestañas para que al tocar una se muestre su panel y se marque como activa. Usá ~data-panel~ y un ~forEach~ para recorrer los botones. Agregá una cuarta pestaña con su panel.`,
    k: ['Se ve un panel por vez', 'La pestaña activa se distingue', 'Usás data-panel', 'Hay una cuarta pestaña que funciona'],
    p: `~document.querySelectorAll('.tab').forEach(function (b) { ... });~`,
    h: `<div class="tabs">
  <button class="tab activa" data-panel="p1">Horario</button>
  <button class="tab" data-panel="p2">Materiales</button>
  <button class="tab" data-panel="p3">Contacto</button>
</div>
<div class="panel" id="p1">Lunes y miércoles de 10 a 12.</div>
<div class="panel" id="p2" hidden>Cuaderno, pendrive y auriculares.</div>
<div class="panel" id="p3" hidden>profe@liceo.edu.uy</div>`,
    s: `body { font-family: sans-serif; padding: 20px; }
.tab { padding: 10px 16px; border: none; background: #eee; cursor: pointer; }
.tab.activa { background: #2D58CF; color: white; }
.panel { border: 1px solid #ddd; padding: 16px; }`,
    j: `// programá las pestañas acá` } },
v: { x: `- ~<dialog>~ es una **ventana modal** nativa: ~dialog.showModal()~ la abre, oscurece el fondo y la tecla Esc la cierra. ~dialog.close()~ la cierra.
- **Menú hamburguesa:** en el celular el menú se esconde y aparece al tocar ☰. El botón debe indicar su estado con ~aria-expanded="true"~ o ~"false"~.

Integrar es hacer que varios componentes convivan en la misma página sin pisarse: nombres de clases claros y cada uno con su propia función.`,
  e: { t: 'Modal y hamburguesa', c: `Integrá en la página: un menú hamburguesa que aparece en el celular (y que actualice ~aria-expanded~) y un botón "Suscribirme" que abra un ~dialog~ con un formulario y un botón para cerrarlo. Los dos tienen que funcionar con teclado.`,
    k: ['El menú se abre y se cierra en pantallas chicas', 'aria-expanded cambia', 'El modal abre con showModal y cierra con botón y con Esc', 'Todo funciona con teclado'],
    p: `~boton.setAttribute('aria-expanded', abierto);~`,
    h: `<header>
  <strong>Club de Lectura</strong>
  <button id="hamb" aria-expanded="false" aria-controls="menu">☰</button>
  <nav id="menu"><a href="#">Inicio</a><a href="#">Libros</a><a href="#">Reuniones</a></nav>
</header>
<main>
  <button id="abrir">Suscribirme</button>
</main>
<dialog id="modal">
  <h2>Suscripción</h2>
  <label for="m">Correo</label> <input id="m" type="email">
  <button id="cerrar">Cerrar</button>
</dialog>`,
    s: `body { font-family: sans-serif; margin: 0; }
header { background: #1A1C2E; color: white; padding: 12px; }
nav a { color: white; display: block; padding: 8px 0; }
nav { display: none; }
nav.abierto { display: block; }
main { padding: 20px; }
dialog::backdrop { background: rgba(0,0,0,0.5); }
@media (min-width: 700px) {
  #hamb { display: none; }
  nav { display: inline; margin-left: 20px; }
  nav a { display: inline; margin-right: 12px; }
}`,
    j: `// programá el menú y el modal` } }
});

tema({ id: '3.8', u: '3', t: 'Pruebas y depuración de JavaScript',
a: `**Depurar es hacer de detective.** El programa no hace lo que esperás: juntás pistas (mensajes de error, valores) hasta encontrar al culpable.`,
b: { x: `Cuando algo no anda, **mirá la consola**: los errores aparecen en rojo con el número de línea. Los más comunes:
- **ReferenceError: x is not defined** → escribiste mal un nombre (JS distingue mayúsculas: ~Nombre~ ≠ ~nombre~).
- **SyntaxError** → falta o sobra un paréntesis, llave o comilla.
- **Cannot read properties of null** → el ~getElementById~ no encontró el elemento (revisá el id).`,
  e: { t: 'Tres errores', c: `Este programa tiene tres errores, uno de cada tipo de la explicación. Usá la consola para encontrarlos y arreglalos. Anotá en un comentario cuál era cada uno y qué decía la consola.`,
    k: ['El programa funciona', 'Están los tres errores explicados', 'Copiaste el mensaje de la consola de cada uno'],
    p: `Arreglá un error, ejecutá de nuevo y mirá cuál aparece después.`,
    h: `<button id="boton">Calcular</button>
<p id="resultado"></p>`,
    s: `body { font-family: sans-serif; padding: 20px; }`,
    j: `let precio = 100;
let cantidad = 3;

document.getElementById('Boton').addEventListener('click', function () {
  let total = precio * Cantidad;
  document.getElementById('resultado').textContent = 'Total: $' + total;
};` } },
i: { x: `A veces no hay error rojo pero el resultado está **mal**: es un **error lógico**.
- Poné ~console.log~ en distintos puntos para ver el valor de las variables.
- **Probá casos:** valores normales, el valor más chico, el más grande, cero, vacío.
- Escribí antes qué resultado esperás. Si lo que da es distinto, ahí está el problema.`,
  e: { t: 'El promedio mentiroso', c: `La función debería calcular el promedio pero da mal. Usá ~console.log~ dentro del for para seguir los valores, encontrá los dos errores lógicos y arreglalos. Probá con ~[10]~, ~[7, 8, 9]~ y ~[]~ (este último debería mostrar "Sin notas").`,
    k: ['Los tres casos dan el resultado correcto', 'Hay console.log que muestran el seguimiento', 'El caso vacío no da NaN'],
    p: `Mirá desde qué número empieza el for y entre qué se divide.`,
    h: `<p id="r"></p>`,
    s: `body { font-family: sans-serif; padding: 20px; }`,
    j: `function promedio(notas) {
  let suma = 0;
  for (let i = 1; i < notas.length; i++) {
    suma = suma + notas[i];
  }
  return suma / 3;
}

document.getElementById('r').textContent = promedio([7, 8, 9]);` } },
v: { x: `Herramientas de profesional:
- **Puntos de interrupción (breakpoints):** en DevTools → Fuentes (Sources) hacés clic en el número de línea; el programa se frena ahí y ves el valor de cada variable paso a paso. En el código podés poner ~debugger;~.
- **try / catch** atrapa un error para que la página no se rompa y puedas mostrar un mensaje amable.
- **Plan de pruebas:** una tabla con qué se prueba, qué se espera y qué pasó. Sirve para no olvidarte de nada antes de entregar.`,
  e: { t: 'Conversor a prueba de errores', c: `El conversor de pesos a dólares se rompe con ciertas entradas. Protegelo con ~try / catch~ y validaciones, y escribí un plan de pruebas de al menos 5 casos (en un comentario) con: entrada, resultado esperado y resultado obtenido. Probá también con ~debugger;~ en tu navegador.`,
    k: ['La página nunca muestra NaN ni se rompe', 'Usás try / catch', 'El plan tiene 5 casos o más', 'Incluís casos límite: vacío, negativo, letras'],
    p: `Dentro del try podés lanzar tu propio error: ~throw new Error('Escribí un número positivo');~`,
    h: `<input id="pesos" placeholder="Pesos uruguayos">
<button id="conv">Convertir</button>
<p id="r"></p>`,
    s: `body { font-family: sans-serif; padding: 20px; }`,
    j: `let cotizacion = 40;

document.getElementById('conv').addEventListener('click', function () {
  let pesos = document.getElementById('pesos').value;
  let dolares = pesos / cotizacion;
  document.getElementById('r').textContent = 'US$ ' + dolares.toFixed(2);
});

/* PLAN DE PRUEBAS
Entrada | Esperado | Obtenido
*/` } }
});

/* ============================ UNIDAD 4 ============================ */
tema({ id: '4.1', u: '4', t: 'Técnicas avanzadas de layout: grid y flexbox',
a: `**Flexbox es una fila de gente en la parada:** ordena cosas en una línea. **Grid es un tablero de ajedrez:** ordena en filas y columnas a la vez.`,
b: { x: `**Flexbox** ordena los hijos de una caja en fila (o en columna):

~.menu { display: flex; }~

- ~justify-content~ los reparte en el eje principal: ~center~, ~space-between~, ~space-around~.
- ~align-items~ los alinea en el otro eje: ~center~, ~flex-start~.
- ~gap: 16px;~ deja espacio entre ellos.
- ~flex-direction: column;~ los pone en columna.`,
  e: { t: 'Barra de navegación', c: `Con flexbox, armá la barra: el logo a la izquierda y los enlaces a la derecha, todo centrado verticalmente, con espacio entre los enlaces. Después centrá la tarjeta en el medio de la sección (horizontal y vertical).`,
    k: ['La barra usa display: flex', 'Logo a la izquierda y enlaces a la derecha', 'Los enlaces tienen gap', 'La tarjeta está centrada en los dos ejes'],
    p: `Logo a un lado y menú al otro: ~justify-content: space-between~. Centrar: ~justify-content: center; align-items: center;~`,
    h: `<header class="barra">
  <strong class="logo">🎮 GameZone</strong>
  <nav class="links"><a href="#">Inicio</a><a href="#">Juegos</a><a href="#">Ranking</a></nav>
</header>
<section class="centro">
  <div class="tarjeta">Estoy en el medio</div>
</section>`,
    s: `body { font-family: sans-serif; margin: 0; }
.barra { background: #1A1C2E; color: white; padding: 12px 20px; }
.links a { color: #9FD3FF; }
.centro { height: 250px; background: #e2eafc; }
.tarjeta { background: white; padding: 20px; border-radius: 10px; }` } },
i: { x: `- ~flex-wrap: wrap;~ deja que los hijos bajen a otra línea si no entran.
- ~flex: 1;~ en un hijo hace que crezca para ocupar el espacio que sobra. Con ~flex: 1 1 200px~ crece, se achica y parte de 200px.

**Grid** arma columnas:

~.galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }~

~1fr~ es "una parte del espacio libre": tres columnas iguales.`,
  e: { t: 'Tarjetas y galería', c: `Primero, con flexbox + wrap, hacé que las tarjetas de precios se acomoden solas (de 3 en computadora, se bajan en el celular). Segundo, con grid, armá la galería de 6 fotos en 3 columnas, y que la primera foto ocupe dos columnas.`,
    k: ['Las tarjetas usan flex-wrap y flex', 'La galería usa grid con repeat y fr', 'La primera foto ocupa dos columnas'],
    p: `Para que ocupe dos columnas: ~grid-column: span 2;~`,
    h: `<div class="precios">
  <div class="plan">Básico</div>
  <div class="plan">Pro</div>
  <div class="plan">Equipo</div>
</div>
<div class="galeria">
  <img src="https://picsum.photos/id/10/400/250" alt="Bosque">
  <img src="https://picsum.photos/id/11/400/250" alt="Campo">
  <img src="https://picsum.photos/id/12/400/250" alt="Playa">
  <img src="https://picsum.photos/id/13/400/250" alt="Costa">
  <img src="https://picsum.photos/id/14/400/250" alt="Mar">
  <img src="https://picsum.photos/id/15/400/250" alt="Cascada">
</div>`,
    s: `body { font-family: sans-serif; padding: 16px; }
.plan { background: #e2eafc; padding: 40px 20px; text-align: center; border-radius: 10px; }
.galeria img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 6px; }
.galeria { margin-top: 24px; }` } },
v: { x: `- ~grid-template-areas~ dibuja el diseño con nombres:

~grid-template-areas: "cab cab" "menu main" "pie pie";~

y cada parte se ubica con ~grid-area: cab;~.
- **Grid que se adapta solo, sin media queries:**

~grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));~

Mete tantas columnas como entren, de al menos 200px.
- Se combinan: grid para la página entera, flexbox para cosas en una línea (menú, botones).`,
  e: { t: 'Diseño de página completo', c: `Armá el layout con ~grid-template-areas~: encabezado arriba, menú lateral a la izquierda, contenido principal y pie. En el celular todo en una columna (cambiá las áreas con una media query). Dentro del main, las tarjetas usan ~auto-fit~ y ~minmax~.`,
    k: ['El layout usa grid-template-areas', 'En celular queda en una columna', 'Las tarjetas se acomodan solas con auto-fit', 'El menú lateral usa flexbox en columna'],
    p: `En celular: ~grid-template-areas: "cab" "menu" "main" "pie";~`,
    h: `<div class="pagina">
  <header>Mi Portal</header>
  <aside><a href="#">Inicio</a><a href="#">Noticias</a><a href="#">Ayuda</a></aside>
  <main>
    <div class="t">1</div><div class="t">2</div><div class="t">3</div>
    <div class="t">4</div><div class="t">5</div>
  </main>
  <footer>2026</footer>
</div>`,
    s: `body { font-family: sans-serif; margin: 0; }
header, footer { background: #1A1C2E; color: white; padding: 16px; }
aside { background: #e2eafc; padding: 16px; }
main { padding: 16px; }

});

tema({ id: '4.2', u: '4', t: 'Optimización del rendimiento y carga de páginas',
a: `**Como armar la mochila para una excursión:** si llevás cosas que no usás, caminás lento. Una página con archivos pesados de más tarda en cargar, sobre todo con datos móviles.`,
b: { x: `Lo que más pesa en una página suelen ser las **imágenes**. Para que carguen rápido:
- **JPG** para fotos, **PNG** para imágenes con transparencia, **SVG** para íconos y logos, **WebP** (más liviano) para casi todo.
- No uses una foto de 4000 píxeles para mostrarla a 400. Achicala antes.
- Comprimila con **squoosh.app**: ves el antes y el después, y cuánto bajó el peso.`,
  e: { t: 'A dieta', c: `Bajá una foto grande de tu celular o de internet. Pasala por squoosh.app: cambiá el tamaño a 1200 px de ancho y el formato a WebP. Respondé: ¿cuánto pesaba antes? ¿cuánto pesa ahora? ¿qué porcentaje bajó? ¿se nota la diferencia a simple vista?`,
    k: ['Los pesos son reales (con KB o MB)', 'Calculaste el porcentaje', 'Opinás sobre la calidad'],
    p: `Porcentaje que bajó = (antes − después) ÷ antes × 100.` } },
i: { x: `En el código también se gana velocidad:
- ~loading="lazy"~ en imágenes que están abajo: cargan cuando llegás.
- ~width~ y ~height~ en las imágenes: el navegador reserva el lugar y la página no "salta".
- Menos archivos: juntá tu CSS en uno solo.
- **Minificar:** quitar espacios y comentarios de CSS y JS para producción.
- El JS con ~defer~ no frena la carga del HTML.
- Fuentes: cargá solo los pesos que usás (400 y 700, no los nueve).`,
  e: { t: 'Revisión de código', c: `Esta página hace casi todo mal para el rendimiento. Corregí lo que puedas en el código y escribí en un comentario la lista de mejoras que hiciste y por qué cada una ayuda.`,
    k: ['Las imágenes de abajo tienen loading="lazy"', 'Todas tienen width y height', 'La fuente pide solo los pesos usados', 'El comentario explica al menos cinco mejoras'],
    p: `Mirá el link de Google Fonts: pide todos los pesos de la fuente.`,
    h: `<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<h1>Galería de viajes</h1>
<img src="https://picsum.photos/id/1036/2400/1600" alt="Montaña nevada">
<p style="height: 600px">Bajá...</p>
<img src="https://picsum.photos/id/1039/2400/1600" alt="Cascada">
<img src="https://picsum.photos/id/1043/2400/1600" alt="Bosque">`,
    s: `body { font-family: 'Roboto', sans-serif; padding: 20px; }
img { width: 400px; display: block; margin-bottom: 12px; }
/* este comentario largo no hace falta en producción */` } },
v: { x: `**Lighthouse** viene en Chrome (DevTools → Lighthouse). Analiza una página y le da puntaje de 0 a 100 en:
- **Rendimiento** (qué tan rápido carga)
- **Accesibilidad**
- **Prácticas recomendadas**
- **SEO** (si los buscadores la entienden)

Además te dice qué arreglar. Métricas importantes: **LCP** (cuánto tarda en verse lo principal) y **CLS** (cuánto "salta" la página mientras carga).`,
  e: { t: 'Auditoría Lighthouse', c: `Publicá un trabajo tuyo (o usá la vista completa de un Pen: Change view → Full Page). Corré Lighthouse en modo celular. Anotá los cuatro puntajes, elegí tres sugerencias, aplicalas, volvé a medir y anotá los puntajes nuevos.`,
    k: ['Están los puntajes de antes y después', 'Elegiste tres sugerencias y explicás qué hiciste', 'Al menos un puntaje mejoró'],
    p: `Corré Lighthouse en una ventana de incógnito: las extensiones del navegador cambian el resultado.` } }
});

tema({ id: '4.3', u: '4', t: 'Sitios web dinámicos y bases de datos',
a: `**Una página estática es un cartel impreso:** dice siempre lo mismo. **Una dinámica es una pizarra** que se actualiza con datos guardados en un fichero (la base de datos).`,
b: { x: `- **Sitio estático:** los archivos HTML son siempre iguales para todo el mundo (un portafolio).
- **Sitio dinámico:** la página se arma con datos que cambian (Instagram, una tienda, el CREA).

Los datos se guardan en una **base de datos**, que funciona como planillas:
- Una **tabla** por cada cosa (usuarios, productos).
- Cada **fila** es un registro (un producto).
- Cada **columna** es un dato (nombre, precio, stock).`,
  e: { t: 'Diseñá la base', c: `Elegí un sitio que uses (una tienda, una app de música, el CREA). Respondé: ¿es estático o dinámico y por qué? Después diseñá una tabla de su base de datos con 4 columnas y escribí 3 filas de ejemplo.`,
    k: ['Justificás si es estático o dinámico', 'La tabla tiene nombre y 4 columnas con sentido', 'Hay 3 filas de ejemplo'],
    p: `Ejemplo: tabla CANCIONES → titulo | artista | duracion | reproducciones` } },
i: { x: `En JavaScript los datos se guardan como **arreglo de objetos**, igual que una tabla:

~let productos = [ { nombre: 'Buzo', precio: 1200 }, { nombre: 'Gorro', precio: 450 } ];~

Con un ~for~ (o ~forEach~) recorrés los datos y **generás el HTML** de cada uno. Así, para agregar un producto no tocás el HTML: agregás un dato. Eso es lo que hace un sitio dinámico.`,
  e: { t: 'Catálogo desde datos', c: `Completá el código para que las tarjetas se generen desde el arreglo. Agregá dos productos más al arreglo. Después agregá un botón que muestre solo los productos de menos de $1000 (~filter~).`,
    k: ['Las tarjetas salen del arreglo', 'Agregar un producto al arreglo agrega una tarjeta', 'El filtro funciona', 'Hay un botón para ver todos de nuevo'],
    p: `~productos.filter(function (p) { return p.precio < 1000; })~ devuelve un arreglo nuevo.`,
    h: `<button id="baratos">Menos de $1000</button>
<button id="todos">Ver todos</button>
<div id="catalogo"></div>`,
    s: `body { font-family: sans-serif; padding: 16px; }
#catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
.prod { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }`,
    j: `let productos = [
  { nombre: 'Buzo del liceo', precio: 1200 },
  { nombre: 'Gorro', precio: 450 },
  { nombre: 'Taza', precio: 380 }
];

function mostrar(lista) {
  let cat = document.getElementById('catalogo');
  cat.innerHTML = '';
  lista.forEach(function (p) {
    // creá la tarjeta de cada producto
  });
}

mostrar(productos);` } },
v: { x: `Para que los datos **no se borren al recargar** la página:
- ~localStorage~ guarda texto en el navegador: ~localStorage.setItem('clave', 'valor')~ y ~getItem('clave')~.
- Para guardar arreglos u objetos se convierten a texto con **JSON**: ~JSON.stringify(datos)~ para guardar y ~JSON.parse(texto)~ para recuperar.

Ojo: localStorage solo vive en **ese navegador**. Un sitio real guarda los datos en un **servidor** con una base de datos (MySQL, PostgreSQL, Firebase) y la página los pide con una API.`,
  e: { t: 'Libreta que recuerda', c: `Hacé una libreta de notas: se escribe una nota, se agrega a la lista y se guarda en localStorage. Al recargar la página, las notas siguen ahí. Cada nota se puede borrar (y se borra también del almacenamiento). Mostrá la fecha de cada nota.`,
    k: ['Las notas sobreviven a la recarga', 'Usás JSON.stringify y JSON.parse', 'Borrar actualiza localStorage', 'Cada nota muestra su fecha'],
    p: `Al empezar: ~let notas = JSON.parse(localStorage.getItem('notas')) || [];~ Fecha: ~new Date().toLocaleDateString()~`,
    h: `<form id="f">
  <input id="txt" placeholder="Escribí una nota">
  <button>Guardar</button>
</form>
<ul id="lista"></ul>`,
    s: `body { font-family: sans-serif; padding: 16px; }
li { background: #fbebd6; margin: 6px 0; padding: 8px; border-radius: 6px; list-style: none; }
small { color: #777; margin-left: 8px; }`,
    j: `let notas = JSON.parse(localStorage.getItem('notas')) || [];

function guardar() {
  localStorage.setItem('notas', JSON.stringify(notas));
}

function dibujar() {
  // mostrá las notas en la lista
}

dibujar();` } }
});

tema({ id: '4.4', u: '4', t: 'Diseño responsive avanzado',
a: `**Como un sillón que se convierte en cama:** el mismo mueble se reacomoda según el espacio. Un buen diseño responsive no solo se achica: se **reorganiza**.`,
b: { x: `Repaso y un paso más:
- Probá tu página en **al menos tres anchos**: celular (375px), tablet (768px) y computadora (1280px).
- En el modo dispositivo de DevTools elegís modelos de celular.
- **Botones y enlaces de al menos 44px** de alto en el celular: el dedo es más grande que el mouse.
- Nada de letra más chica que 16px en el celular.`,
  e: { t: 'Revisión en tres pantallas', c: `Probá esta página en los tres anchos con el modo dispositivo. Arreglá: los botones chicos, la letra chica en celular y la tabla que se sale de la pantalla. Escribí en un comentario qué viste en cada ancho.`,
    k: ['Los botones tienen al menos 44px de alto', 'La letra es legible en celular', 'La tabla no rompe el ancho', 'El comentario describe los tres anchos'],
    p: `Para la tabla, envolvela en un div con ~overflow-x: auto~.`,
    h: `<h1>Horarios del gimnasio</h1>
<button>Inscribirme</button> <button>Ver precios</button>
<table>
  <tr><th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th><th>Sábado</th></tr>
  <tr><td>Funcional 8:00</td><td>Spinning 9:00</td><td>Yoga 10:00</td><td>Funcional 8:00</td><td>Zumba 19:00</td><td>Libre</td></tr>
</table>`,
    s: `body { font-family: sans-serif; padding: 10px; font-size: 12px; }
button { font-size: 10px; padding: 2px 4px; }
table { border-collapse: collapse; }
td, th { border: 1px solid #ccc; padding: 8px; white-space: nowrap; }` } },
i: { x: `Imágenes que se adaptan:
- ~object-fit: cover;~ hace que la imagen llene su caja sin deformarse (recorta lo que sobra).
- ~aspect-ratio: 16 / 9;~ mantiene la proporción de una caja.
- ~<picture>~ muestra **otra imagen** según la pantalla:

~<picture><source media="(min-width: 800px)" srcset="grande.jpg"><img src="chica.jpg" alt="..."></picture>~

Así el celular baja una imagen liviana y la compu una grande.`,
  e: { t: 'Imágenes inteligentes', c: `Usá ~picture~ para que el banner muestre una imagen vertical en el celular y una horizontal desde 800px. En la grilla de productos, que todas las fotos tengan la misma proporción (~aspect-ratio~) y no se deformen (~object-fit~).`,
    k: ['El banner cambia de imagen según el ancho', 'Las fotos de la grilla tienen igual proporción', 'Ninguna se ve deformada'],
    p: `Imagen vertical: ~https://picsum.photos/id/1011/500/700~. Horizontal: ~https://picsum.photos/id/1011/1200/400~.`,
    h: `<img class="banner" src="https://picsum.photos/id/1011/1200/400" alt="Lago con montañas">
<div class="grilla">
  <img src="https://picsum.photos/id/20/400/600" alt="Escritorio">
  <img src="https://picsum.photos/id/21/600/300" alt="Zapatos">
  <img src="https://picsum.photos/id/22/400/400" alt="Persona caminando">
</div>`,
    s: `body { font-family: sans-serif; margin: 0; }
.banner { width: 100%; display: block; }
.grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
.grilla img { width: 100%; }` } },
v: { x: `- **Container queries:** el componente se adapta al ancho **de su contenedor**, no de la pantalla. Así la misma tarjeta se ve bien en una columna angosta o en una ancha.

~.zona { container-type: inline-size; }~
~@container (min-width: 400px) { .tarjeta { display: flex; } }~

- Combinado con ~clamp()~ y grid ~auto-fit~, se logran diseños que casi no necesitan media queries.`,
  e: { t: 'Tarjeta camaleón', c: `La misma tarjeta está en una columna angosta y en una ancha. Con container queries, hacé que en la angosta la foto vaya arriba del texto y en la ancha al costado. Usá ~clamp()~ para el tamaño del título de la tarjeta.`,
    k: ['Usás container-type y @container', 'La tarjeta cambia según su contenedor, no según la pantalla', 'El título usa clamp()'],
    p: `Las dos columnas necesitan ~container-type: inline-size~.`,
    h: `<div class="layout">
  <aside class="zona">
    <div class="tarjeta"><img src="https://picsum.photos/id/30/300/200" alt="Taza de café"><div><h3>Café</h3><p>Taller de barismo los sábados.</p></div></div>
  </aside>
  <main class="zona">
    <div class="tarjeta"><img src="https://picsum.photos/id/30/300/200" alt="Taza de café"><div><h3>Café</h3><p>Taller de barismo los sábados.</p></div></div>
  </main>
</div>`,
    s: `body { font-family: sans-serif; margin: 0; padding: 12px; }
.layout { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.tarjeta { border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
.tarjeta img { width: 100%; display: block; }
.tarjeta div { padding: 10px; }` } }
});

tema({ id: '4.5', u: '4', t: 'Diseño de interfaces de usuario intuitivas',
a: `**Una buena interfaz es como una puerta bien hecha:** sabés si se empuja o se tira sin leer ningún cartel.`,
b: { x: `Principios para que la interfaz se entienda sola:
- **Jerarquía visual:** lo más importante es más grande, más fuerte o tiene más color.
- **Consistencia:** los botones se ven igual en todas las páginas; el menú está siempre en el mismo lugar.
- **Que parezca lo que es:** un botón parece botón (fondo, borde); un enlace se distingue del texto.
- **Menos es más:** si todo resalta, nada resalta.`,
  e: { t: 'Crítica de una app', c: `Elegí una app o sitio que uses todos los días. Respondé:
- ¿Qué es lo primero que ves al abrirla? ¿Por qué?
- Encontrá un ejemplo de consistencia (algo que se repite igual).
- Encontrá algo confuso o difícil de encontrar.
- ¿Cómo lo mejorarías?`,
    k: ['Respondiste las cuatro preguntas', 'Los ejemplos son concretos', 'La mejora tiene sentido'],
    p: `Sacá una captura y miralá de lejos: lo que más resalta es lo que ganó la jerarquía.` } },
i: { x: `Una interfaz intuitiva **responde**:
- **Estados de los botones:** normal, ~:hover~ (mouse encima), ~:focus-visible~ (con teclado), ~:active~ (apretado), ~:disabled~ (no disponible).
- **Feedback:** después de cada acción, algo cambia: un mensaje, un color, un ícono de carga.
- **Íconos con texto:** un ícono solo puede no entenderse; "🗑 Borrar" no deja dudas.
- **Acciones peligrosas** (borrar) se ven distintas y piden confirmación.`,
  e: { t: 'Botones que responden', c: `Diseñá los cinco estados del botón principal. Hacé que el botón "Enviar" muestre "Enviando…" y quede deshabilitado 2 segundos, y después "¡Enviado!". El botón "Borrar cuenta" tiene que verse peligroso y pedir confirmación (~confirm~).`,
    k: ['El botón tiene los cinco estados', 'Enviar da feedback y se deshabilita', 'Borrar se ve distinto y pide confirmación', 'Los íconos tienen texto'],
    p: `~if (confirm('¿Seguro? No se puede deshacer')) { ... }~`,
    h: `<button id="enviar" class="btn">📨 Enviar</button>
<button id="borrar" class="btn">Borrar cuenta</button>
<p id="msj"></p>`,
    s: `body { font-family: sans-serif; padding: 20px; }
.btn { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 8px; background: #2D58CF; color: white; cursor: pointer; }`,
    j: `document.getElementById('enviar').addEventListener('click', function () {
  // feedback
});` } },
v: { x: `Antes de programar, los diseñadores hacen:
- **Wireframe:** boceto en blanco y negro con cajas. Solo importa dónde va cada cosa.
- **Prototipo:** versión con colores que se puede "clickear" (en Figma, por ejemplo).

Principios de la psicología que se usan en interfaces:
- **Proximidad:** lo que está cerca parece relacionado.
- **Ley de Hick:** más opciones = más tiempo para decidir.
- **Formularios cortos:** pedí solo lo necesario, agrupá los campos y poné el label arriba del campo.`,
  e: { t: 'Rediseño del formulario', c: `Este formulario de inscripción es confuso. Rediseñalo aplicando proximidad, labels arriba, campos agrupados (datos personales / contacto), menos campos (sacá los innecesarios) y un botón principal claro. Explicá en un comentario cada decisión.`,
    k: ['Los campos están agrupados con fieldset o secciones', 'Sacaste campos innecesarios y explicaste por qué', 'Hay un solo botón principal claro', 'Cada decisión está explicada'],
    p: `~<fieldset><legend>Datos personales</legend>...</fieldset>~ agrupa campos.`,
    h: `<form>
  Nombre <input> Apellido <input> Segundo apellido <input>
  Color favorito <input> Correo <input> Repetir correo <input>
  Teléfono <input> Teléfono alternativo <input> Fax <input>
  <button>Cancelar</button> <button>Borrar</button> <button>Enviar</button>
</form>`,
    s: `body { font-family: sans-serif; padding: 20px; }
input { margin: 4px; }` } }
});

tema({ id: '4.6', u: '4', t: 'Multimedia y elementos interactivos avanzados',
a: `**Pasar de un póster a un tablero de juego.** La página ya no solo se mira: se toca, se dibuja, se escucha.`,
b: { x: `Video de calidad:
- ~poster="imagen.jpg"~ muestra una portada antes de darle play.
- ~<track src="subs.vtt" kind="subtitles" srclang="es" label="Español">~ agrega subtítulos (accesibilidad).
- ~preload="none"~ evita descargar el video hasta que se usa.
- Nunca pongas ~autoplay~ con sonido: molesta y es inaccesible. Si hace falta, ~autoplay muted~.`,
  e: { t: 'Video accesible', c: `Mejorá el video: agregá póster, controles, ~preload~ y un párrafo de descripción para quien no lo puede ver. Agregá también un enlace para descargarlo. En un comentario explicá para qué sirve ~<track>~.`,
    k: ['El video tiene poster, controls y preload', 'Hay descripción en texto', 'El comentario explica track'],
    p: `Póster: ~https://picsum.photos/id/152/640/360~`,
    h: `<h2>Cómo florece una flor</h2>
<video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" width="400" autoplay></video>`,
    s: `body { font-family: sans-serif; padding: 20px; }
video { max-width: 100%; }` } },
i: { x: `- **SVG en línea:** dibujos hechos con código (~<circle>~, ~<rect>~, ~<path>~). No pierden calidad al agrandarse y se pueden colorear con CSS (~fill~) y animar con ~:hover~.
- **Mapas:** OpenStreetMap y Google Maps dan un ~<iframe>~ para insertar (en OpenStreetMap: Compartir → HTML).`,
  e: { t: 'Ícono SVG y mapa', c: `Dibujá con SVG un ícono simple (una casa con techo, cuerpo y puerta, o una cara) y hacé que cambie de color con hover desde el CSS. Insertá un mapa de OpenStreetMap de tu ciudad o de tu liceo.`,
    k: ['El ícono usa al menos tres figuras SVG', 'Cambia de color con CSS', 'El mapa se ve y tiene title'],
    p: `~<rect x="20" y="50" width="60" height="40" fill="tomato"/>~ dibuja un rectángulo.`,
    h: `<svg width="100" height="100" viewBox="0 0 100 100" class="icono">
  <polygon points="10,50 50,10 90,50" class="techo"/>
</svg>
<iframe title="Mapa de Montevideo" width="400" height="250" src="https://www.openstreetmap.org/export/embed.html?bbox=-56.25,-34.93,-56.10,-34.86&layer=mapnik"></iframe>`,
    s: `body { font-family: sans-serif; padding: 20px; }
.techo { fill: crimson; transition: fill 0.3s; }
.icono:hover .techo { fill: darkorange; }
iframe { display: block; max-width: 100%; border: 0; margin-top: 12px; }` } },
v: { x: `- **Canvas:** un lienzo donde dibujás con JS píxel por píxel. Sirve para juegos, gráficos y apps de dibujo:

~let ctx = canvas.getContext('2d');~
~ctx.fillRect(10, 10, 50, 50);~

- **Controles propios para video:** ~video.play()~, ~video.pause()~, ~video.currentTime~ y ~video.volume~ permiten hacer tu propio reproductor.`,
  e: { t: 'Pizarra digital', c: `Programá una pizarra en canvas: se dibuja arrastrando el mouse, se puede elegir el color con ~<input type="color">~ y el grosor con ~<input type="range">~, y un botón la borra. Desafío: que funcione también con el dedo en el celular (eventos ~pointer~).`,
    k: ['Se dibuja arrastrando', 'Cambian color y grosor', 'El botón borra todo', 'Desafío: funciona con el dedo'],
    p: `Usá ~pointerdown~, ~pointermove~ y ~pointerup~: sirven para mouse y dedo. Posición: ~e.offsetX~, ~e.offsetY~.`,
    h: `<input type="color" id="color" value="#2D58CF">
<input type="range" id="grosor" min="1" max="30" value="5">
<button id="borrar">Borrar</button>
<canvas id="lienzo" width="500" height="300"></canvas>`,
    s: `body { font-family: sans-serif; padding: 12px; }
canvas { display: block; margin-top: 8px; border: 2px solid #ccc; border-radius: 8px; touch-action: none; max-width: 100%; background: white; }`,
    j: `let lienzo = document.getElementById('lienzo');
let ctx = lienzo.getContext('2d');
let dibujando = false;

lienzo.addEventListener('pointerdown', function (e) {
  dibujando = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
});

// completá pointermove y pointerup` } }
});

tema({ id: '4.7', u: '4', t: 'APIs y servicios web',
a: `**Una API es el mozo de un restaurante.** Vos (tu página) no entrás a la cocina (el servidor): le pedís al mozo con el menú (la documentación) y él te trae el plato (los datos).`,
b: { x: `Una **API** es una forma de pedirle datos a otro servicio: el clima, fotos, noticias, monedas.

Los datos llegan en **JSON**, un formato de texto parecido a los objetos de JavaScript:

~{ "ciudad": "Montevideo", "temperatura": 18, "lluvia": false }~

- Las claves van entre comillas dobles.
- Los valores pueden ser texto, número, true/false, listas ~[ ]~ u objetos ~{ }~.`,
  e: { t: 'Leer JSON', c: `Abrí en el navegador esta dirección: ~https://dog.ceo/api/breeds/image/random~. Respondé: ¿qué datos trae? ¿cuáles son las claves y sus valores? Recargá tres veces: ¿qué cambia? Después pensá: ¿qué API te gustaría que existiera para un proyecto tuyo y qué datos traería?`,
    k: ['Identificaste las claves y los valores', 'Notaste qué cambia al recargar', 'Propusiste una API con datos de ejemplo en JSON'],
    p: `Firefox muestra el JSON ordenado. En Chrome marcá "Dar formato" (pretty print).` } },
i: { x: `~fetch~ pide datos a una API:

~fetch('https://dog.ceo/api/breeds/image/random')~
~  .then(function (r) { return r.json(); })~
~  .then(function (datos) { console.log(datos.message); });~

1. ~fetch~ hace el pedido.
2. El primer ~then~ convierte la respuesta a JSON.
3. El segundo ~then~ usa los datos.

Mientras espera, mostrá "Cargando…": las APIs pueden tardar.`,
  e: { t: 'Perrito al azar', c: `Completá el código para que el botón traiga una foto de perro al azar y la muestre. Mientras carga, el botón dice "Cargando…". Después cambiá la dirección para pedir solo una raza (la documentación está en dog.ceo/dog-api).`,
    k: ['El botón trae una foto nueva', 'Muestra "Cargando…" mientras espera', 'Pediste una raza específica', 'La imagen tiene alt'],
    p: `Una raza: ~https://dog.ceo/api/breed/beagle/images/random~`,
    h: `<button id="traer">Traer perrito</button>
<div><img id="perro" alt="Foto de un perro" width="300"></div>`,
    s: `body { font-family: sans-serif; padding: 20px; text-align: center; }
#perro { max-width: 100%; margin-top: 12px; border-radius: 10px; }`,
    j: `let boton = document.getElementById('traer');

boton.addEventListener('click', function () {
  boton.textContent = 'Cargando…';
  fetch('https://dog.ceo/api/breeds/image/random')
    .then(function (r) { return r.json(); })
    .then(function (datos) {
      // mostrá la foto y volvé a poner el texto del botón
    });
});` } },
v: { x: `- ~async / await~ hace el código más fácil de leer:

~async function cargar() { let r = await fetch(url); let datos = await r.json(); }~

- ~try / catch~ atrapa el error si no hay internet o la API falla. Siempre mostrá un mensaje amable.
- Muchas APIs reciben **parámetros** en la dirección después de ~?~: ~?latitude=-34.9&longitude=-56.16~.
- Algunas piden una **clave (API key)**. Nunca la publiques en GitHub.`,
  e: { t: 'El clima de hoy', c: `Usá la API de Open-Meteo (gratis, sin clave) para mostrar la temperatura actual y el viento de Montevideo con ~async/await~. Agregá un selector de ciudades (Montevideo, Salto, Rivera, Maldonado) que cambie los datos. Manejá el error con ~try/catch~.`,
    k: ['Usás async/await', 'Muestra temperatura y viento', 'El selector cambia de ciudad', 'Si falla, se ve un mensaje amable'],
    p: `Coordenadas: Salto (-31.38, -57.96), Rivera (-30.90, -55.55), Maldonado (-34.90, -54.95). Los datos llegan en ~datos.current.temperature_2m~.`,
    h: `<select id="ciudad">
  <option value="-34.90,-56.16">Montevideo</option>
</select>
<div id="clima">Elegí una ciudad</div>`,
    s: `body { font-family: sans-serif; padding: 20px; }
#clima { font-size: 1.6rem; margin-top: 12px; }`,
    j: `async function cargar(lat, lon) {
  let url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,wind_speed_10m';
  // completá con try / catch
}

cargar(-34.90, -56.16);` } }
});

tema({ id: '4.8', u: '4', t: 'Prácticas modernas y tendencias en diseño web',
a: `**Como la moda:** algunas cosas son pasajeras y otras llegan para quedarse. Hoy se quedan la accesibilidad, el modo oscuro, la velocidad y respetar las preferencias de cada persona.`,
b: { x: `Tendencias actuales:
- **Diseño minimalista:** mucho espacio en blanco, pocas cosas, bien elegidas.
- **Modo oscuro:** casi todas las apps lo tienen.
- **Tipografías grandes y con personalidad** en los títulos.
- **Accesibilidad primero:** ya no es un extra, es obligatoria en muchos países.
- **Diseño para el celular primero** (mobile first).
- **Microinteracciones:** pequeñas animaciones que confirman lo que hiciste (un corazón que late al darle "me gusta").`,
  e: { t: 'Cazador de tendencias', c: `Elegí tres sitios o apps actuales. Para cada uno, anotá qué tendencias de la lista usa, con un ejemplo concreto. Después elegí la tendencia que más te gusta y explicá cómo la usarías en tu proyecto final.`,
    k: ['Analizaste tres sitios', 'Cada tendencia tiene un ejemplo concreto', 'Explicás cómo la usarías en tu proyecto'],
    p: `Mirá también cómo se ven esos sitios en el celular.` } },
i: { x: `El navegador sabe qué prefiere cada persona y tu CSS puede respetarlo:
- ~@media (prefers-color-scheme: dark)~ → la persona usa modo oscuro en su sistema.
- ~@media (prefers-reduced-motion: reduce)~ → la persona pidió menos animaciones.

Con **variables CSS** el modo oscuro es fácil: solo cambiás los valores de las variables dentro de la media query.`,
  e: { t: 'Tema automático', c: `Definí variables para fondo, texto, tarjeta y acento. Hacé que la página cambie sola a modo oscuro según la preferencia del sistema. Agregá ~prefers-reduced-motion~ para apagar la animación. Probalo cambiando el tema de tu computadora o celular.`,
    k: ['Los colores salen de variables', 'Cambia sola con prefers-color-scheme', 'prefers-reduced-motion apaga la animación'],
    p: `En DevTools: tres puntitos → More tools → Rendering → "Emulate CSS prefers-color-scheme".`,
    h: `<div class="tarjeta">
  <h2>Noticias del liceo</h2>
  <p>Se viene la semana de la ciencia.</p>
  <span class="nuevo">NUEVO</span>
</div>`,
    s: `:root {
  --fondo: #f4f4f8;
  --texto: #1a1c2e;
}
body { background: var(--fondo); color: var(--texto); font-family: sans-serif; padding: 20px; }
.tarjeta { padding: 20px; border-radius: 12px; }
.nuevo { display: inline-block; animation: brillo 1s infinite alternate; }
@keyframes brillo { to { transform: scale(1.2); } }` } },
v: { x: `Prácticas de los equipos profesionales:
- **Componentes reutilizables** y **sistemas de diseño** (como Material Design): las mismas piezas en todo el sitio.
- **Frameworks de CSS** como Tailwind (clases chiquitas que se combinan) o Bootstrap.
- **PWA:** sitios que se instalan como app y funcionan sin internet.
- **Control de versiones** con Git y GitHub.
- **IA** para generar ideas, imágenes o código. Ojo: siempre revisá y entendé lo que te da, y respetá derechos de autor.`,
  e: { t: 'Interruptor de tema', c: `Hacé un botón que cambie entre claro y oscuro manualmente, que **recuerde** la elección con localStorage y que, si la persona nunca eligió, use la preferencia del sistema. Agregá en un comentario tu opinión: ¿qué ventajas y riesgos tiene usar IA para programar?`,
    k: ['El botón alterna el tema', 'La elección se recuerda al recargar', 'Sin elección usa la del sistema', 'El comentario muestra ventajas y riesgos'],
    p: `~window.matchMedia('(prefers-color-scheme: dark)').matches~ te dice la preferencia del sistema. Poné el tema en ~document.documentElement.dataset.tema~.`,
    h: `<button id="tema">🌓 Cambiar tema</button>
<h1>Mi portfolio</h1>
<p>Proyectos de diseño web.</p>`,
    s: `:root { --fondo: white; --texto: #1a1c2e; }
[data-tema="oscuro"] { --fondo: #14152a; --texto: #ececf7; }
body { background: var(--fondo); color: var(--texto); font-family: sans-serif; padding: 20px; transition: background 0.3s; }`,
    j: `// 1. ¿Hay algo guardado en localStorage?
// 2. Si no, ¿qué prefiere el sistema?
// 3. Al tocar el botón, cambiar y guardar` } }
});

tema({ id: '5.1', u: '5', t: 'Diseño e implementación de un proyecto web',
a: `**Como organizar un cumpleaños:** antes de comprar nada, decidís para quién es, qué se va a hacer, quién se encarga de qué y para cuándo.`,
b: { x: `El proyecto final es un **sitio web real** que van a publicar. Primero se planifica:
- **Tema:** algo que les interese (un club, una banda, un juego, un emprendimiento del barrio).
- **Objetivo:** ¿para qué sirve el sitio?
- **Mapa del sitio:** las páginas o secciones que va a tener y cómo se conectan.`,
  e: { t: 'Idea y mapa del sitio', c: `Escribí: el tema de tu sitio, su objetivo en una oración y el mapa del sitio con al menos tres secciones (con qué va a tener cada una).`,
    k: ['El tema es claro', 'El objetivo cabe en una oración', 'El mapa tiene al menos tres secciones con su contenido'],
    p: `Ejemplo: "Sitio del club de ajedrez para que nuevos socios se inscriban". Secciones: Inicio, Horarios, Inscripción.` } },
i: { x: `Un **brief** es el documento que ordena el proyecto:
- **Público:** ¿quién lo va a usar? (edad, qué necesita, desde qué dispositivo)
- **Objetivo y contenido** de cada sección.
- **Roles del equipo:** diseño, contenidos, programación, pruebas. Todos programan algo.
- **Cronograma:** qué se hace cada semana hasta la entrega.`,
  e: { t: 'El brief del equipo', c: `Escriban el brief completo: público, objetivo, secciones con contenido, roles de cada integrante y un cronograma por semana hasta la entrega.`,
    k: ['El público está descrito', 'Cada integrante tiene un rol', 'El cronograma tiene fechas reales', 'Las secciones tienen contenido definido'],
    p: `Pensá en la persona que va a usar el sitio: ¿qué busca en los primeros 5 segundos?` } },
v: { x: `Organización como equipo profesional:
- **Tablero de tareas** (Trello, GitHub Projects o una planilla) con columnas "Por hacer", "Haciendo", "Hecho".
- **Tareas chicas:** "Hacer el menú responsive" en vez de "Hacer la página".
- **Definición de terminado:** qué tiene que cumplir una tarea para estar hecha (se ve en celular, pasa el validador, tiene alt…).
- **Repositorio en GitHub** desde el día uno.`,
  e: { t: 'Tablero y criterios', c: `Armen el tablero con al menos 12 tareas chicas repartidas entre el equipo y escriban su "definición de terminado" (mínimo 5 criterios). Pegá el link al tablero y al repositorio.`,
    k: ['El tablero tiene 12 tareas o más, con responsable', 'Hay definición de terminado con 5 criterios', 'El repositorio existe'],
    p: `Una tarea está bien escrita si alguien la puede terminar en una clase.` } }
});

tema({ id: '5.2', u: '5', t: 'Diseño de la interfaz y estructura de las páginas',
a: `**Como el plano de una casa:** primero se dibuja dónde va cada ambiente, después se construye y al final se pinta.`,
b: { x: `- **Wireframe:** dibujá en papel cada sección con cajas: dónde va el título, el menú, las imágenes, los textos. Sin colores.

  e: { t: 'Del papel al HTML', c: `Hacé el wireframe en papel (sacale una foto para entregar). Después escribí la estructura HTML de tu página principal con etiquetas semánticas y textos de prueba.`,
    k: ['El wireframe muestra todas las secciones', 'El HTML usa etiquetas semánticas', 'La estructura coincide con el wireframe'],
    p: `Si el texto final todavía no está, usá textos de prueba cortos.`,

  <h1>Nombre del sitio</h1>
  <nav></nav>
</header>
<main>
  <section id="inicio"></section>
</main>
<footer></footer>`,
    s: `body { font-family: sans-serif; margin: 0; }

i: { x: `Una **guía de estilo** define la identidad visual del sitio:
- **Paleta:** 2 o 3 colores principales + neutros (fondo y texto). Revisá el contraste.

  e: { t: 'Guía de estilo', c: `Definí en ~:root~ la paleta y las tipografías de tu proyecto, y armá una página de muestra con: títulos h1 a h3, un párrafo, un enlace, un botón principal, uno secundario y una tarjeta.`,

    h: `<h1>Título 1</h1>
<h2>Título 2</h2>
<h3>Título 3</h3>
<p>Párrafo de prueba con un <a href="#">enlace</a>.</p>
<button class="btn">Principal</button>
<button class="btn sec">Secundario</button>
<div class="tarjeta">Tarjeta</div>`,
    s: `:root {
  --primario: #2D58CF;
  --texto: #1A1C2E;
  --fondo: #FFFFFF;
}
body { font-family: sans-serif; color: var(--texto); background: var(--fondo); padding: 20px; }` } },

  e: { t: 'Layout del proyecto', c: `Programá el layout completo de tu página principal: estructura con grid y áreas, menú responsive y todas las secciones con su contenido real. Probalo en tres anchos.`,
    k: ['Usa grid-template-areas', 'Funciona en celular, tablet y computadora', 'El menú es responsive', 'Pasa el validador de HTML'],
    p: `Arrancá del layout del tema 4.1 avanzado y adaptalo.`,

  <nav>Menú</nav>
  <main>Contenido</main>
  <footer>Pie</footer>
</div>`,

});

tema({ id: '5.3', u: '5', t: 'Funcionalidades interactivas y multimedia',

v: { x: `Nivel avanzado: el sitio usa **datos**.

  e: { t: 'Datos en el proyecto', c: `Integrá en tu proyecto una funcionalidad que use datos: generados desde un arreglo, guardados con localStorage o traídos de una API. Explicá en el README qué hace y de dónde salen los datos.`,

tema({ id: '5.4', u: '5', t: 'Pruebas, depuración y optimización del proyecto',
a: `**El ensayo general antes del estreno:** se prueba todo como si fuera de verdad para que el día del show no haya sorpresas.`,
b: { x: `Lista de chequeo básica:

    k: ['Revisaste los cinco puntos', 'Cada problema tiene su arreglo', 'El sitio quedó sin errores en consola'] } },
i: { x: `**Prueba con usuarios:** le pedís a alguien que no conoce el sitio que haga una tarea ("encontrá el horario del sábado") mientras mirás **sin ayudar**.

v: { x: `Calidad profesional antes de publicar:

  e: { t: 'Informe de calidad', c: `Hacé un informe de calidad de tu sitio: resultado del validador, puntajes de Lighthouse (antes y después de mejorar), prueba con teclado y prueba en dos navegadores. Indicá qué arreglaste en cada caso.`,

var RUBRICA = [
  ['Estructura HTML', 'Usa etiquetas básicas correctamente y todas las imágenes tienen alt.', 'Usa etiquetas semánticas y la página se entiende con el lector de pantalla.', 'Pasa el validador sin errores y se navega por completo con teclado.'],
  ['Diseño con CSS', 'Tiene colores y tipografías que combinan y el texto se lee bien.', 'Usa variables, flexbox o grid y una guía de estilo coherente.', 'Layout con grid-template-areas, efectos y transiciones prolijas.'],
  ['Responsive', 'Se ve completo en el celular, sin scroll horizontal.', 'Usa media queries para reorganizar el contenido.', 'Mobile first, imágenes adaptativas y tamaños fluidos.'],
  ['Interactividad', 'Tiene un elemento interactivo que funciona.', 'Tiene dos componentes con JavaScript bien organizados.', 'Usa datos (arreglo, localStorage o API) con manejo de errores.'],
  ['Proceso y publicación', 'Está publicado y el link funciona.', 'Publicado en GitHub Pages, con pruebas de usuario hechas.', 'README completo, informe de calidad y presentación con demo.']
];

/* ================================ GLOSARIO ================================ */
var GLOSARIO = [
  ['API', 'Forma de pedirle datos a otro servicio desde tu página.'],
  ['Atributo', 'Dato extra en una etiqueta HTML, como href o alt.'],
  ['Breakpoint', 'Ancho de pantalla donde el diseño cambia con una media query.'],

  ['CodePen', 'Editor online con paneles HTML, CSS y JS y el resultado en vivo.'],
  ['Consola', 'Parte de las DevTools donde se ven mensajes y errores de JavaScript.'],
  ['CSS', 'Lenguaje que define cómo se ve una página: colores, tamaños, lugar.'],
  ['DevTools', 'Herramientas del navegador para inspeccionar y probar una página (F12).'],
  ['DOM', 'El árbol de elementos que arma el navegador a partir del HTML.'],
  ['Evento', 'Algo que pasa en la página: un clic, una tecla, un envío.'],
  ['Flexbox', 'Forma de ordenar elementos en una fila o columna.'],
  ['Framework', 'Estructura de código con reglas propias para hacer apps grandes (React, Vue).'],
  ['GitHub Pages', 'Servicio gratis de GitHub para publicar sitios web.'],
  ['Grid', 'Forma de ordenar elementos en filas y columnas a la vez.'],
  ['HTML', 'Lenguaje que define qué hay en una página: títulos, textos, imágenes.'],
  ['JavaScript', 'Lenguaje que hace que la página reaccione y haga cosas.'],
  ['JSON', 'Formato de texto para intercambiar datos entre programas.'],
